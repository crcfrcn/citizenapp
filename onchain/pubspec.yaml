name: citizen_onchain
description: 公民App链上交易包。
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"

# 只声明本包源码的直接依赖；版本沿用拆分前产品约束。
dependencies:
  citizen_chain: any
  citizen_assets: any
  citizen_personal: any
  citizen_scanner: any
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: main
  citizen_storage: any
  citizen_system: any
  citizen_user: any
  citizen_wallet: any
  citizen_widgets: any
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  substrate_metadata: 1.6.0

dev_dependencies:
  polkadart: 0.7.3
  citizen_multisig: any
  citizen_testing: any
  flutter_test:
    sdk: flutter
