name: citizen_citizen
description: 公民Appcitizen包。
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"

# 本包公开接口的真实依赖；上游约束沿用产品原锁。
dependencies:
  citizen_account: any
  citizen_assets: any
  citizen_scanner: any
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: main
  citizen_storage: any
  citizen_system: any
  citizen_transaction: any
  citizen_wallet: any
  citizen_widgets: any
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  isar_community: ^3.3.2
  polkadart: 0.7.3
  polkadart_keyring: 0.7.1
  provider: ^6.1.5+1
  webview_flutter: ^4.13.0

dev_dependencies:
  citizen_testing: any
  flutter_test:
    sdk: flutter
