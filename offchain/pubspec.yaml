name: citizen_offchain
description: 公民App链下交易包。
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"

# 只声明本包源码的直接依赖；版本沿用拆分前产品约束。
dependencies:
  citizen_citizen: any
  citizen_scanner: any
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: main
  citizen_storage: any
  citizen_system: any
  citizen_wallet: any
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  citizen_testing: any
  flutter_test:
    sdk: flutter
