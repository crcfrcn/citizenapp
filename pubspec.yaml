name: citizenapp
description: CitizenApp mobile client using CitizenSDK blockchain capabilities.
publish_to: "none"
version: 1.0.0+40

environment:
  sdk: ">=3.8.0 <4.0.0"

workspace:
  - account
  - wallet
  - transaction
  - citizen
  - '8964'
  - chat
  - network
  - scanner
  - storage
  - system
  - widgets
  - assets
  - testing

dependencies:
  citizen_account: any
  citizen_wallet: any
  citizen_transaction: any
  citizen_citizen: any
  citizen_square: any
  citizen_chat: any
  citizen_network: any
  citizen_scanner: any
  citizen_storage: any
  citizen_system: any
  citizen_widgets: any
  citizen_assets: any
  flutter:
    sdk: flutter
  # 钱包、签名、唯一 QR_V1、轻节点、链读取、交易与 execution history
  # 统一由固定Git提交的 CitizenSDK 提供；CitizenApp 只保留产品 UI 和业务语义。
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: main
  http: 1.6.0
  shared_preferences: ^2.5.5
  polkadart: 0.7.3
  # 业务事件按原始 metadata 的字段名、类型和显式索引解码；沿用锁定原件版本。
  substrate_metadata: 1.6.0
  polkadart_scale_codec: 1.6.0
  # 0.7.1 与本产品使用的 polkadart 0.7.x 共同依赖 ss58 1.x；0.7.2 已切到
  # ss58 2.x，会造成解依赖冲突。两款移动产品统一锁定同一兼容版本。
  polkadart_keyring: 0.7.1
  # QR协议、图像编码/识别及采集只由CitizenSDK提供，App仅绘制原界面。
  flutter_svg: ^2.3.0
  local_auth: ^3.0.2
  # 生物识别对话框文案本地化需要直接引用消息类(local_auth 不再导出它们)。
  # 版本跟随 local_auth 的传递依赖,不单独升级。
  local_auth_android: 2.0.9
  local_auth_darwin: ^2.0.0
  image_picker: ^1.2.3
  # 发布页统一相册：双端同一网格，支持图片数量上限及“多图或单视频”选择中互斥。
  wechat_assets_picker: ^10.1.2
  crypto: 3.0.7
  # 应用锁使用标准 PBKDF2-HMAC-SHA256 实现，避免手写循环产生额外分配。
  pointycastle: ^4.0.0
  # isar 3.1 上游已停更且预编译 .so 未 16KB 对齐;改用社区维护分支 isar_community
  # (沿用 isar 3.x API 与 DB 格式,不迁移数据;libisar.so 已 16KB 对齐)。
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  saver_gallery: 5.1.0
  # CitizenApp 不实现 sr25519；钱包签名与验签全部由 CitizenSDK 提供。
  # polkadart_keyring 仅用于 App 现有 SS58 地址编解码，禁止用它另造签名实现。
  path: ^1.9.1
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0
  # Chat 自绘 Composer 通过现有 flutter_chat_ui Provider 同步输入栏高度。
  provider: ^6.1.5+1
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  webview_flutter: ^4.13.0
  video_player: 2.11.1
  image_size_getter: ^2.4.1
  flutter_image_compress: 2.4.0
  # 文章正文富文本编辑器；11.5.1 实现 Flutter 3.44 新增的 TextInputClient.onFocusReceived。
  flutter_quill: 11.5.1
  # CitizenApp直接依赖公开TataChatSDK根包的唯一固定Git提交。
  tatachat_sdk:
    git:
      url: https://github.com/tuyutata/tatachatsdk.git
      path: .
      ref: main
dev_dependencies:
  citizen_testing: any
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # 仅媒体处理回归直接使用；运行时图像能力由SDK声明。
  image: 4.9.1

flutter:
  # 两款移动产品统一使用 CocoaPods，禁止本机全局配置
  # 把某一产品单独切到 Swift Package Manager 后形成双轨原生依赖状态。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
