<!doctype html>
<html lang="zh-CN" data-topup-document="{{TOPUP_NONCE}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <!-- Reown 把远端钱包图标转换为 blob URL 后再显示；blob 仅开放给图片，
         字体只开放官方字体域名，脚本仅允许App本次装配的随包资源nonce。 -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-{{TOPUP_NONCE}}'; style-src 'unsafe-inline'; img-src 'self' data: blob: https:; font-src https://fonts.reown.com; connect-src https: wss:; frame-src https:; child-src https:; base-uri 'none'; form-action 'none'" />
    <title>连接钱包支付</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #F7F9FC; color: #1A2B3C;
        font-family: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .spinner { width: 44px; height: 44px; border: 3px solid rgba(0,122,116,.18);
        border-top-color: #007A74; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title { margin: 18px 0 4px; font-size: 16px; }
      .sub { margin: 0; font-size: 13px; color: #5A6B7C; }
      .amount { margin-top: 10px; font-size: 15px; font-weight: 600; color: #007A74; }
      .err { color: #EF4444; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" id="spinner"></div>
      <p class="title" id="title">正在唤起 WalletConnect…</p>
      <p class="sub" id="sub">在弹出的钱包中确认连接与支付</p>
      <p class="amount" id="amount"></p>
    </div>
    <!-- 本产品源码按原锁在工作工程构建，所有协议均由同一随包入口提供。 -->
    <script nonce="{{TOPUP_NONCE}}" src="data:application/javascript;base64,{{TOPUP_SCRIPT}}"></script>
    <!-- 由同一随包脚本的实际完成状态触发启动，不把平台历史URL回调当成文档就绪。 -->
    <script nonce="{{TOPUP_NONCE}}">
      window.TopupBridge.postMessage(JSON.stringify({
        kind: 'document_ready',
        nonce: document.documentElement.getAttribute('data-topup-document'),
        ready: typeof window.CitizenTopup?.start === 'function'
      }));
    </script>
  </body>
</html>
