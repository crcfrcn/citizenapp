  citizen_storage: any
  citizen_system: any
  citizen_wallet: any
  citizen_widgets: any
  crypto: 3.0.7
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: 1.6.0
  isar_community: ^3.3.2
  polkadart: 0.7.3
  polkadart_keyring: 0.7.1
  polkadart_scale_codec: 1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  substrate_metadata: 1.6.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

dev_dependencies:
  citizen_testing: any
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - web/walletconnect.html
    - web/walletconnect.bundle.js
