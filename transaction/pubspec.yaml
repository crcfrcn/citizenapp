name: citizen_transaction
description: 公民Apptransaction包。
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"

# 本包公开接口的真实依赖；上游约束沿用产品原锁。
dependencies:
  citizen_account: any
  citizen_assets: any
  citizen_citizen: any
  citizen_network: any
  citizen_scanner: any
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
