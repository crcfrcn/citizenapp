# 一个产品平台一次执行只有一个Run，所有产品执行归本仓Workflow。
name: 公民·iOS
run-name: 公民·iOS·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: citizenapp-ios
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
defaults:
  run:
    shell: bash
env:
  PLATFORM: ios
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  version:
    name: 公民·iOS·版本
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '25.2.1'
          check-latest: false
      - id: version
        name: 计算本Run版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" > "$RUNNER_TEMP/previous.json"
          node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let version=/^version:\s*([^+\s]+)/mu.exec(readFileSync('pubspec.yaml','utf8'))[1];
          const previous=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/previous.json','utf8')).workflow_runs[0];
          if(previous){
            const data=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+previous.id+'/artifacts?per_page=100'],{encoding:'utf8'}));
            const prefix="公民·iOS·v";
            const artifact=data.artifacts.find(value=>value.name.startsWith(prefix)&&/^\d+\.\d+\.\d+$/u.test(value.name.slice(prefix.length)));
            const parts=artifact.name.slice(prefix.length).split('.');parts[2]=String(BigInt(parts[2])+1n);version=parts.join('.');
          }
          console.log('version='+version);
          NODE
  compile:
    needs: version
    if: github.ref == 'refs/heads/main' && github.repository == 'crcfrcn/citizenapp'
    name: 公民·iOS·v${{ needs.version.outputs.version }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: ''
      CITIZENAPP_VERSION: ${{ needs.version.outputs.version }}
      CITIZENAPP_SOURCE_ROOT: ${{ github.workspace }}
      PUB_CACHE: ${{ github.workspace }}/target/cache/pub
      GRADLE_USER_HOME: ${{ github.workspace }}/target/cache/gradle
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cache/rust
      RUSTUP_TOOLCHAIN: 1.97.1
      FLUTTER_ROOT: ${{ github.workspace }}/target/cache/flutter
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      # 官方v6支持原锁JDK的四段版本，固定同一发行件构建号。
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-
      - name: 准备官方工具和本轮目录
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" target/cache
          echo "WORK=$work" >> "$GITHUB_ENV"
          if [ ! -d "$FLUTTER_ROOT/.git" ]; then
            git clone --branch 3.47.2 --depth 1 https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" --version --machine | jq -e '.frameworkVersion=="3.47.2"' >/dev/null
          # 原锁CitizenSDK的Apple入口同时消费iOS和macOS Release引擎。
          "$FLUTTER_ROOT/bin/flutter" precache --ios --macos
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-apple-ios aarch64-apple-ios-sim
          gem install cocoapods -v 1.17.0 --no-document --install-dir "$work/gems"
          echo "GEM_HOME=$work/gems" >> "$GITHUB_ENV"
          echo "$work/gems/bin" >> "$GITHUB_PATH"
          # 通过官方sdkmanager仅安装Apple原生依赖所需的同版CMake。
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          # App资源工具与其他官方工具在同一步准备，不增加功能构建步骤。
          version=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('assets/topup/package.json')).citizenapp.tools.esbuild)")
          npm install --prefix "$work/tools" --ignore-scripts --no-audit --no-fund "esbuild@$version"
          echo "ESBUILD_BIN=$work/tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
      - name: 按本产品原锁装配普通工程
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {assembleProject} from './scripts/build.mjs';
          await assembleProject(process.env);
          JS
      - name: 准备原生测试输入
        run: |
          set -euo pipefail
          cd "$WORK/project"
          flutter pub get --enforce-lockfile
          node --input-type=module <<'JS'
          import {readFileSync, copyFileSync, appendFileSync} from 'node:fs';
          import {fileURLToPath} from 'node:url';
          import {join} from 'node:path';
          const file = new URL('file://' + process.cwd() + '/.dart_tool/package_config.json');
          const entry = JSON.parse(readFileSync(file)).packages.find(row => row.name === 'isar_community_flutter_libs');
          if (!entry) throw Error('原锁缺少Isar');
          const library = process.env.WORK + '/libisar.dylib';
          // rootUri可不带尾斜线；先解析包根路径，避免URL拼接替换末级包目录。
          const packageRoot = fileURLToPath(new URL(entry.rootUri, file));
          copyFileSync(join(packageRoot, 'macos', 'libisar.dylib'), library);
          appendFileSync(process.env.GITHUB_ENV, 'ISAR_CORE_LIB_PATH=' + library + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'CITIZENAPP_TEST_WORK_DIR=' + process.env.WORK + '\n');
          JS
          git clone --filter=blob:none --sparse --depth=1 https://github.com/crcfrcn/citizenchain.git "$WORK/chain"
          git -C "$WORK/chain" sparse-checkout set runtime/primitives/tests/fixtures
          git -C "$WORK/chain" rev-parse HEAD > "$WORK/chain-source-sha"
          echo "CITIZENCHAIN_ROOT=$WORK/chain" >> "$GITHUB_ENV"
      - name: AI代码回归、严格分析及完整Flutter测试
        run: |
          set -euo pipefail
          node --test test/release_manifest.test.mjs test/transaction/topup/bridge.test.mjs
          cd "$WORK/project"
          flutter analyze --fatal-infos --fatal-warnings --no-pub
          flutter test --no-pub --concurrency=1 --fail-fast \
            --file-reporter "json:$WORK/flutter-report.jsonl"
          node --input-type=module <<'JS'
          import {readFileSync, readdirSync} from 'node:fs';
          const events = readFileSync(process.env.WORK + '/flutter-report.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          const starts = new Set(events.filter(row => row.type === 'testStart').map(row => row.test.id));
          const ended = events.filter(row => row.type === 'testDone');
          const done = events.filter(row => row.type === 'done');
          const walk = path => readdirSync(path, {withFileTypes: true}).flatMap(entry =>
              entry.isDirectory() ? walk(path + '/' + entry.name) : [path + '/' + entry.name]);
          const expected = walk(process.cwd() + '/test').filter(path => path.endsWith('_test.dart'));
          const loaded = events.filter(row => row.type === 'suite').map(row => row.suite.path);
          if (!starts.size || done.length !== 1 || done[0].success !== true || ended.length !== starts.size ||
              ended.some(row => row.skipped || row.result !== 'success') || expected.some(path => !loaded.includes(path))) {
              throw Error('Flutter全量回归失败、跳过或不完整');
          }
          JS
      - name: 准备本轮Apple签名输入
        env:
          IOS_KEY: ${{ secrets.IOS_KEY }}
          CITIZENAPP_PROFILE: ${{ secrets.CITIZENAPP_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$WORK/signing"
          python3 - <<'PY'
          import os, pathlib, base64, re
          work = pathlib.Path(os.environ['WORK']) / 'signing'
          fields = {}
          for raw in os.environ['IOS_KEY'].splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              name, separator, value = line.partition('=')
              if not separator or name in fields or not value:
                  raise ValueError('IOS_KEY字段无效')
              fields[name] = value
          if set(fields) != {'pkcs12', 'password', 'certificate_sha1'} or not re.fullmatch('[0-9A-F]{40}', fields['certificate_sha1']):
              raise ValueError('IOS_KEY内容无效')
          (work / 'distribution.p12').write_bytes(base64.b64decode(fields['pkcs12'], validate=True))
          (work / 'password').write_text(fields['password'])
          (work / 'certificate').write_text(fields['certificate_sha1'])
          (work / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['CITIZENAPP_PROFILE'], validate=True))
          PY
          security list-keychains -d user > "$WORK/signing/keychains"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keychain="$WORK/signing/release.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$WORK/signing/distribution.p12" -k "$keychain" \
            -P "$(cat "$WORK/signing/password")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          python3 - <<'PY'
          import os, pathlib, subprocess, shlex
          directory = pathlib.Path(os.environ['WORK']) / 'signing'
          original = shlex.split((directory / 'keychains').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', str(directory / 'release.keychain-db'), *original], check=True)
          PY
          security cms -D -i "$WORK/signing/profile.mobileprovision" > "$WORK/signing/profile.plist"
          plutil -convert json -o "$WORK/signing/project.json" "$WORK/project/ios/Runner.xcodeproj/project.pbxproj"
          python3 - <<'PY'
          import os, pathlib, plistlib, hashlib, datetime, json, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          profile = plistlib.loads((directory / 'profile.plist').read_bytes())
          certificate = (directory / 'certificate').read_text()
          entitlement = profile['Entitlements']
          if profile['TeamIdentifier'] != ['MHYMVRN6FC'] or entitlement.get('application-identifier') != 'MHYMVRN6FC.ios.citizenapp' or entitlement.get('get-task-allow') is not False:
              raise ValueError('描述文件应用身份不符')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise ValueError('描述文件已过期')
          if certificate not in [hashlib.sha1(value).hexdigest().upper() for value in profile['DeveloperCertificates']]:
              raise ValueError('描述文件证书不符')
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (profile['UUID'] + '.mobileprovision')
          destination.parent.mkdir(parents=True, exist_ok=True)
          if destination.exists():
              raise ValueError('描述文件路径已占用')
          (directory / 'installed-profile').write_text(str(destination))
          shutil.copyfile(directory / 'profile.mobileprovision', destination)
          project = json.loads((directory / 'project.json').read_text())
          for obj in project['objects'].values():
              settings = obj.get('buildSettings', {})
              if obj.get('name') == 'Release' and settings.get('PRODUCT_BUNDLE_IDENTIFIER') == 'ios.citizenapp':
                  settings.update(CODE_SIGN_STYLE='Manual', DEVELOPMENT_TEAM='MHYMVRN6FC',
                      CODE_SIGN_IDENTITY='Apple Distribution', PROVISIONING_PROFILE_SPECIFIER=profile['UUID'])
          (directory / 'project.json').write_text(json.dumps(project))
          export = {'method': 'release-testing' if profile.get('ProvisionedDevices') else 'app-store-connect',
              'teamID': 'MHYMVRN6FC', 'signingStyle': 'manual', 'signingCertificate': certificate,
              'provisioningProfiles': {'ios.citizenapp': profile['UUID']}}
          (directory / 'export.plist').write_bytes(plistlib.dumps(export))
          PY
          plutil -convert xml1 -o "$WORK/project/ios/Runner.xcodeproj/project.pbxproj" "$WORK/signing/project.json"
          security find-identity -v -p codesigning "$keychain" > "$WORK/signing/identities"
          grep -Fq "$(cat "$WORK/signing/certificate")" "$WORK/signing/identities"
      - name: 编译并导出正式IPA
        id: build
        run: node scripts/build.mjs ios
      - name: 核对iOS正式包
        run: |
          set -euo pipefail
          name="公民·iOS·v$CITIZENAPP_VERSION"
          unzip -q "$WORK/artifact/$name.ipa" -d "$WORK/verify"
          apps=("$WORK"/verify/Payload/*.app)
          test "${#apps[@]}" = 1
          app="${apps[0]}"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = ios.citizenapp
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "$CITIZENAPP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$GITHUB_RUN_NUMBER"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2> "$WORK/signing/verified"
          grep -Fxq TeamIdentifier=MHYMVRN6FC "$WORK/signing/verified"
          node --input-type=module <<'JS'
          import {readdirSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const work = process.env.WORK;
          const apps = readdirSync(work + '/verify/Payload').filter(name => name.endsWith('.app'));
          const sdk = await import(pathToFileURL(work + '/sources/tatachat_sdk/scripts/build.mjs'));
          await sdk.verifyNative(work + '/verify/Payload/' + apps[0] + '/Frameworks/TataChatSDK.framework/TataChatSDK', 'ios');
          JS
      - name: 生成本轮正式附件说明
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, writeFileSync, readdirSync, statSync} from 'node:fs';
          const work = process.env.WORK, title = '公民·iOS·v' + process.env.CITIZENAPP_VERSION;
          const directory = work + '/artifact';
          const digest = file => execFileSync('shasum', ['-a', '256', file], {encoding: 'utf8'}).split(' ')[0];
          const asset = name => ({name, size: statSync(directory + '/' + name).size, sha256: digest(directory + '/' + name)});
          const proof = {
              schema: 1, product_id: 'citizenapp', platform: process.env.PLATFORM,
              version: process.env.CITIZENAPP_VERSION, version_code: Number(process.env.GITHUB_RUN_NUMBER),
              source_sha: process.env.GITHUB_SHA, run_id: Number(process.env.GITHUB_RUN_ID),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              chain_test_sha: readFileSync(work + '/chain-source-sha', 'utf8').trim(),
              assets: readdirSync(directory).sort().map(asset)
          };
          const name = title + '.json';
          writeFileSync(directory + '/' + name, JSON.stringify(proof, null, 2) + '\n');
          proof.assets.push(asset(name));
          writeFileSync(work + '/proof.json', JSON.stringify(proof, null, 2) + '\n');
          JS
      - name: 公民·iOS·v${{ needs.version.outputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民·iOS·v${{ needs.version.outputs.version }}
          path: ${{ env.WORK }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="公民·iOS·v$CITIZENAPP_VERSION"
          encoded="$(jq -nr --arg value "$name" '$value|@uri')"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$WORK/releases.json"
          old="$(jq -c --arg tag "$name" '[.[][]|select(.tag_name==$tag)]' "$WORK/releases.json")"
          test "$(jq 'length' <<< "$old")" -le 1
          if [ "$(jq 'length' <<< "$old")" = 1 ]; then
            proof="$(jq -r '.[0].body' <<< "$old")"
            jq -e --arg version "$CITIZENAPP_VERSION" '.product_id=="citizenapp" and .platform=="ios" and .version==$version' <<< "$proof" >/dev/null
            previous_run="$(jq -r .run_id <<< "$proof")"
            previous_attempt="$(jq -r .run_attempt <<< "$proof")"
            previous_sha="$(jq -r .source_sha <<< "$proof")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/attempts/$previous_attempt" \
              | jq -e --arg sha "$previous_sha" '.status=="completed" and .conclusion!="success" and .head_sha==$sha and .path==".github/workflows/ios.yml"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
              | jq -e --arg sha "$previous_sha" '.object.type=="commit" and .object.sha==$sha' >/dev/null
            gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # 未登记的同名Tag绝不覆盖。只有本轮新建对象可被失败回滚删除。
          export CITIZENAPP_RELEASE_NAME="$name"
          tag_created=false
          rollback() {
            code=$?
            if [ "$code" != 0 ]; then
              # gh创建成功但附件上传失败也可能留下草稿，按本Run证明准确查回。
              owned="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name==env.CITIZENAPP_RELEASE_NAME and .target_commitish==env.GITHUB_SHA)|select((.body|fromjson?|.run_id)==(env.GITHUB_RUN_ID|tonumber))|.id')" || echo '本次Release查询未完成' >&2
              if [[ "${owned:-}" =~ ^[1-9][0-9]*$ ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$owned" || echo '本次Release撤销未完成' >&2
              fi
              if [ "$tag_created" = true ]; then
                if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null; then
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded" || echo '本次Tag撤销未完成' >&2
                else
                  echo '本次Tag归属或撤销状态未确认' >&2
                fi
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$name" -f "sha=$GITHUB_SHA" > "$WORK/tag.json"
          tag_created=true
          assets=()
          for file in "$WORK/artifact/"*; do assets+=("$file#$(basename "$file")"); done
          gh release create "$name" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "$name" --notes-file "$WORK/proof.json" --draft
          gh release view "$name" --repo "$GITHUB_REPOSITORY" --json assets > "$WORK/assets.json"
          mkdir "$WORK/readback"
          for file in "$WORK/artifact/"*; do
            label="$(basename "$file")"
            remote="$(jq -er --arg label "$label" '[.assets[]|select(.label==$label)]|if length==1 then .[0].name else error("附件标签不唯一") end' "$WORK/assets.json")"
            gh release download "$name" --repo "$GITHUB_REPOSITORY" --pattern "$remote" --output "$WORK/readback/$label"
            cmp "$file" "$WORK/readback/$label"
          done
          gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" --arg tag "$name" '.draft==false and .prerelease==false and .published_at!=null and .name==$tag and .tag_name==$tag and .target_commitish==$sha and (.assets|length)==2' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          trap - EXIT
      # 同一Run交付成功后上传同一份IPA；只等待Apple处理，不提交审核或上架。
      - name: 上传正式IPA到App Store Connect
        timeout-minutes: 30
        env:
          APPSTORE_KEYID: ${{ secrets.APPSTORE_KEYID }}
          APPSTORE_ISSUERID: ${{ secrets.APPSTORE_ISSUERID }}
          APPSTORE_PRIVATEKEY: ${{ secrets.APPSTORE_PRIVATEKEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPSTORE_KEYID:?缺少APPSTORE_KEYID}"
          : "${APPSTORE_ISSUERID:?缺少APPSTORE_ISSUERID}"
          : "${APPSTORE_PRIVATEKEY:?缺少APPSTORE_PRIVATEKEY}"
          # 私钥只写本轮签名现场，不进入正式附件；上传成败均立即删除。
          export API_PRIVATE_KEYS_DIR="$WORK/signing/appstore"
          mkdir "$API_PRIVATE_KEYS_DIR"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          printf '%s\n' "$APPSTORE_PRIVATEKEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_KEYID.p8"
          xcrun altool --upload-package "$WORK/artifact/公民·iOS·v$CITIZENAPP_VERSION.ipa" \
            --api-key "$APPSTORE_KEYID" --api-issuer "$APPSTORE_ISSUERID" \
            --wait --output-format json
      - name: 保存官方增量缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮普通现场和签名输入
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${WORK:-}" ]; then exit 0; fi
          test "$WORK" = "$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          if (work / 'build-active.json').exists():
              raise RuntimeError('编译进程退出未确认，保留现场')
          if (directory / 'keychains').exists():
              original = shlex.split((directory / 'keychains').read_text())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *original], check=True)
          if (directory / 'release.keychain-db').exists():
              subprocess.run(['security', 'delete-keychain', str(directory / 'release.keychain-db')], check=True)
          if (directory / 'installed-profile').exists():
              pathlib.Path((directory / 'installed-profile').read_text()).unlink(missing_ok=True)
          shutil.rmtree(work)
          PY
      # 不新增Job或Run；只清本仓本平台已结束的历史，失败不取消另一端。
      - name: 删除本平台旧记录及附属数据并回查
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CITIZENAPP_CLEANUP_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = crcfrcn/citizenapp
          test "$GITHUB_REF" = refs/heads/main
          case "$PLATFORM" in ios) label=iOS ;; android) label=Android ;; *) exit 1 ;; esac
          case "$CITIZENAPP_CLEANUP_RESULT" in
            success) outcome=success ;;
            failure|cancelled) outcome=failed ;;
            *) echo '此前Job结果未确认，禁止清理' >&2; exit 1 ;;
          esac
          base="repos/$GITHUB_REPOSITORY"
          workflow=".github/workflows/$PLATFORM.yml"
          prefix="citizenapp-$PLATFORM-"

          # 只将真实404视为不存在；权限、网络和服务错误不能冒充删除成功。
          absent() {
            local response
            if response="$(gh api --method GET --include --silent "$base/$1" 2>&1)"; then
              echo "对象仍存在：$1" >&2; return 1
            fi
            if [[ ! "$response" =~ HTTP/[0-9.]+[[:space:]]404 ]]; then
              echo "对象删除状态未确认：$1" >&2; return 1
            fi
          }
          optional() {
            local value
            if value="$(gh api --method GET "$base/$1" 2>/dev/null)"; then
              printf '%s\n' "$value"
            else
              absent "$1" || return 1
              printf 'null\n'
            fi
          }
          remove() {
            if ! gh api --method DELETE "$base/$1"; then absent "$2" || return 1; fi
            absent "$2"
          }
          pages() {
            gh api --method GET --paginate --slurp "$base/$1?per_page=100" |
              jq -ce --arg field "$2" 'map(if $field == "" then . else .[$field] end) |
                if all(.[]; type == "array") then add // [] else error("分页响应不是数组") end'
          }
          read_runs() {
            pages "actions/workflows/$PLATFORM.yml/runs" workflow_runs |
              jq -c --arg repo "$GITHUB_REPOSITORY" --arg path "$workflow" \
                '[.[] | select(.repository.full_name == $repo and .path == $path and .head_branch == "main")]'
          }
          remove_cache() {
            if ! gh api --method DELETE "$base/actions/caches/$1"; then
              pages actions/caches actions_caches | jq -e --argjson id "$1" 'all(.[]; .id != $id)' >/dev/null || return 1
            fi
            pages actions/caches actions_caches | jq -e --argjson id "$1" 'all(.[]; .id != $id)' >/dev/null
          }
          remove_release() {
            local release="$1" id="$2" sha="$3" name="$4" attempt="$5"
            local tag encoded ref release_id
            tag="$(jq -r .tag_name <<<"$release")"
            if jq -e --arg tag "$tag" 'index($tag) != null' <<<"$protected" >/dev/null; then return; fi
            jq -e --arg platform "$PLATFORM" --arg sha "$sha" --arg name "$name" \
              --argjson id "$id" --argjson attempt "$attempt" '
              (.body | fromjson) as $proof | $proof.product_id == "citizenapp" and
              $proof.platform == $platform and $proof.run_id == $id and $proof.source_sha == $sha and
              ($proof.run_attempt | type) == "number" and $proof.run_attempt > 0 and
              $proof.run_attempt <= $attempt and .tag_name == $name and .target_commitish == $sha' <<<"$release" >/dev/null
            encoded="$(jq -nr --arg tag "$tag" '$tag | @uri')"
            ref="$(optional "git/ref/tags/$encoded")"
            if [ "$ref" != null ]; then
              jq -e --arg sha "$sha" '.object.type == "commit" and .object.sha == $sha' <<<"$ref" >/dev/null
              remove "git/refs/tags/$encoded" "git/ref/tags/$encoded"
            fi
            release_id="$(jq -r .id <<<"$release")"
            remove "releases/$release_id" "releases/$release_id"
          }
          current="$(gh api --method GET "$base/actions/runs/$GITHUB_RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg path "$workflow" --arg sha "$GITHUB_SHA" \
            --argjson id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '.id == $id and .run_attempt == $attempt and .head_sha == $sha and
             .repository.full_name == $repo and .path == $path and .head_branch == "main"' <<<"$current" >/dev/null
          runs="$(read_runs)"
          runs="$(jq -c --argjson current "$current" \
            'if any(.[]; .id == $current.id) then . else . + [$current] end' <<<"$runs")"
          jq -e --argjson id "$GITHUB_RUN_ID" \
            'all(.[]; .status != "completed" or .id <= $id)' <<<"$runs" >/dev/null

          # 当前Run尚未终态，只单独计算候选类别，不改写GitHub返回的状态。
          keep="$(jq -c --argjson id "$GITHUB_RUN_ID" --arg outcome "$outcome" '
            [.[] | select(.status == "completed" or .id == $id) |
              {id, order: .run_number, result: (if .id == $id then $outcome
                elif .conclusion == "success" then "success" else "failed" end)}] |
            group_by(.result) | map(max_by([.order, .id]).id)' <<<"$runs")"
          active="$(jq -c '[.[] | select(.status != "completed") | .id]' <<<"$runs")"
          keep="$(jq -cn --argjson keep "$keep" --argjson active "$active" --argjson id "$GITHUB_RUN_ID" \
            '$keep + $active + [$id] | unique')"
          protected="$(jq -c --argjson keep "$keep" \
            '[.[] | .id as $id | select($keep | index($id)) | .display_title] | unique' <<<"$runs")"
          obsolete="$(jq -c --argjson keep "$keep" \
            '[.[] | .id as $id | select(.status == "completed" and ($keep | index($id) | not))] |
             sort_by([.conclusion == "success", .run_number, .id])' <<<"$runs")"

          # 已删除Run的正式对象只能凭本产品原回执及真实404认领，不按模糊名称删除。
          releases="$(pages releases '')"
          while IFS= read -r release; do
            owner="$(jq -er '.body | fromjson | .run_id | select(type == "number" and . > 0 and . == floor)' <<<"$release")"
            if jq -e --argjson owner "$owner" 'any(.[]; .id == $owner)' <<<"$runs" >/dev/null; then continue; fi
            absent "actions/runs/$owner"
            proof="$(jq -er '.body | fromjson' <<<"$release")"
            sha="$(jq -er '.source_sha | select(test("^[a-f0-9]{40}$"))' <<<"$proof")"
            name="$(jq -er --arg label "$label" '"公民·" + $label + "·v" + .version' <<<"$proof")"
            remove_release "$release" "$owner" "$sha" "$name" "$(jq -er .run_attempt <<<"$proof")"
          done < <(jq -c --arg platform "$PLATFORM" '.[] |
            select((.body | fromjson?) as $proof | $proof.product_id == "citizenapp" and $proof.platform == $platform)' <<<"$releases")

          # 缓存独立于Run存在；先清真实404旧Run留下的本平台孤立缓存。
          caches="$(pages actions/caches actions_caches)"
          jq -e --arg prefix "$prefix" 'all(.[] |
            select(.ref == "refs/heads/main" and (.key | startswith($prefix)));
            (.id | type) == "number" and (.key | test("-[1-9][0-9]*-[1-9][0-9]*$")))' <<<"$caches" >/dev/null
          while IFS= read -r cache; do
            owner="$(jq -er '.key | capture("-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$") | .run | tonumber' <<<"$cache")"
            if jq -e --argjson owner "$owner" 'any(.[]; .id == $owner)' <<<"$runs" >/dev/null; then continue; fi
            absent "actions/runs/$owner"
            cache_id="$(jq -r .id <<<"$cache")"
            remove_cache "$cache_id"
          done < <(jq -c --arg prefix "$prefix" \
            '.[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix)))' <<<"$caches")

          # 失败旧记录先清，旧成功记录及其附件最后清；保留共享版本的正式对象。
          while IFS= read -r old; do
            id="$(jq -r .id <<<"$old")"
            sha="$(jq -r .head_sha <<<"$old")"
            name="$(jq -r .display_title <<<"$old")"
            fresh="$(gh api --method GET "$base/actions/runs/$id")"
            jq -e --argjson old "$old" --arg path "$workflow" \
              '.status == "completed" and .path == $path and .head_branch == "main" and
               .id == $old.id and .run_attempt == $old.run_attempt and .head_sha == $old.head_sha' <<<"$fresh" >/dev/null
            releases="$(pages releases '')"
            while IFS= read -r release; do
              remove_release "$release" "$id" "$sha" "$name" "$(jq -r .run_attempt <<<"$old")"
            done < <(jq -c --argjson id "$id" '.[] | select((.body | fromjson? | .run_id) == $id)' <<<"$releases")
            if ! jq -e --arg name "$name" 'index($name) != null' <<<"$protected" >/dev/null; then
              # 无Release的孤立Tag只按本平台准确Run名称和提交归属删除。
              case "$name" in "公民·${label}·v"*) ;; *) echo '旧Run名称无法确认Tag归属' >&2; exit 1 ;; esac
              encoded="$(jq -nr --arg tag "$name" '$tag | @uri')"
              attached="$(optional "releases/tags/$encoded")"
              if [ "$attached" != null ]; then
                echo '旧Tag仍有归属未确认的Release，禁止删除' >&2; exit 1
              fi
              ref="$(optional "git/ref/tags/$encoded")"
              if [ "$ref" != null ]; then
                jq -e --arg sha "$sha" '.object.type == "commit" and .object.sha == $sha' <<<"$ref" >/dev/null
                remove "git/refs/tags/$encoded" "git/ref/tags/$encoded"
              fi
            fi
            artifacts="$(pages "actions/runs/$id/artifacts" artifacts)"
            while IFS= read -r artifact_id; do
              remove "actions/artifacts/$artifact_id" "actions/artifacts/$artifact_id"
            done < <(jq -r '.[].id' <<<"$artifacts")
            caches="$(pages actions/caches actions_caches)"
            while IFS= read -r cache_id; do
              remove_cache "$cache_id"
            done < <(jq -r --arg prefix "$prefix" --argjson id "$id" '
              .[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix))) |
              select((.key | capture("-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$") | .run | tonumber) == $id) | .id' <<<"$caches")
            remove "actions/runs/$id" "actions/runs/$id"
            absent "actions/runs/$id/logs"
            pages releases '' | jq -e --argjson id "$id" --argjson protected "$protected" \
              'all(.[]; (.body | fromjson? | .run_id) != $id or (.tag_name as $tag | $protected | index($tag) != null))' >/dev/null
            printf '已删除并回查本平台旧Run及附属数据：%s\n' "$id"
          done < <(jq -c '.[]' <<<"$obsolete")

          remaining="$(read_runs)"
          jq -e --argjson keep "$keep" \
            'all(.[]; .status != "completed" or (.id as $id | $keep | index($id) != null))' <<<"$remaining" >/dev/null
          pages actions/artifacts artifacts | jq -e --argjson stale "$(jq -c '[.[].id]' <<<"$obsolete")" \
            'all(.[]; .workflow_run.id as $id | $stale | index($id) == null)' >/dev/null
          caches="$(pages actions/caches actions_caches)"
          jq -e --arg prefix "$prefix" --argjson keep "$keep" '
            all(.[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix)));
              (.key | capture("-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$") | .run | tonumber) as $id |
              ($keep | index($id)) != null)' <<<"$caches" >/dev/null
          # 无法认领的本平台旧正式对象必须报错，不能漏掉后声称清理成功。
          pages releases '' | jq -e --arg prefix "公民·${label}·v" --argjson protected "$protected" '
            if all(.[] | select(.tag_name | startswith($prefix));
              .tag_name as $tag | $protected | index($tag) != null)
            then true else error("本平台仍有未清理或归属未确认的Release") end' >/dev/null
          encoded="$(jq -nr --arg prefix "公民·${label}·v" '$prefix | @uri')"
          pages "git/matching-refs/tags/$encoded" '' | jq -e --argjson protected "$protected" '
            if all(.[]; (.ref | ltrimstr("refs/tags/")) as $tag | $protected | index($tag) != null)
            then true else error("本平台仍有归属未确认的Tag") end' >/dev/null
          printf '本平台历史清理完成，保留Run：%s；本Run最终结果仍由GitHub确认。\n' "$keep"
  cleanup:
    name: 公民·iOS·收尾
    needs: [version, compile]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: 保留本平台最新版本、成功失败记录和缓存
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.version.result == 'success' && needs.compile.result == 'success' && 'success' || 'failure' }}
          PREFIX: 公民·iOS·v
          CACHE_PREFIX: citizenapp-ios-
        run: |
          set -euo pipefail
          workflow="${GITHUB_WORKFLOW_REF%@*}"; workflow="${workflow##*/}"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > "$RUNNER_TEMP/caches.json"
          jq -r --arg prefix "$CACHE_PREFIX" '[.[].actions_caches[]|select(.ref=="refs/heads/main" and (.key|startswith($prefix)))]|sort_by(.created_at,.id)|reverse|.[1:][]|.id' "$RUNNER_TEMP/caches.json" |
          while IFS= read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
          if [ "$RESULT" = success ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            jq -r --arg prefix "$PREFIX" '[.[][]|select(.draft==false and (.tag_name|startswith($prefix)))]|sort_by(.published_at,.id)|reverse|.[1:][]|.tag_name' "$RUNNER_TEMP/releases.json" |
            while IFS= read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"
          jq --argjson current "$GITHUB_RUN_ID" --arg result "$RESULT" '
            [.[].workflow_runs[]|select(.status=="completed" or .id==$current)|
             .+{state:(if .id==$current then $result elif .conclusion=="success" then "success" else "failure" end)}]|
            group_by(.state)|map(sort_by(.run_number)|last.id)' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/keep.json"
          jq -r --argjson current "$GITHUB_RUN_ID" --slurpfile keep "$RUNNER_TEMP/keep.json" '
            [.[].workflow_runs[]|select(.status=="completed" and .id!=$current)|select(.id as $id|$keep[0]|index($id)|not)]|
            sort_by(.conclusion=="success",.run_number)[]|.id' "$RUNNER_TEMP/runs.json" |
          while IFS= read -r id; do gh run delete "$id" --repo "$GITHUB_REPOSITORY"; done
