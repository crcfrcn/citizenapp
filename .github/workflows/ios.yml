# 一个产品平台一次执行只有一个Run，所有产品执行归本仓Workflow。
name: 公民·iOS
run-name: 公民·iOS·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: citizenapp-ios
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
defaults:
  run:
    shell: bash
env:
  PLATFORM: ios
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  version:
    name: 公民·iOS·版本
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '25.2.1'
          check-latest: false
      - id: version
        name: 计算本Run版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release.mjs version ios

  compile:
    needs: version
    if: github.ref == 'refs/heads/main' && github.repository == 'crcfrcn/citizenapp'
    name: 公民·iOS·v${{ needs.version.outputs.version }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: ''
      CITIZENAPP_VERSION: ${{ needs.version.outputs.version }}
      CITIZENAPP_SOURCE_ROOT: ${{ github.workspace }}
      PUB_CACHE: ${{ github.workspace }}/target/cache/pub
      GRADLE_USER_HOME: ${{ github.workspace }}/target/cache/gradle
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cache/rust
      RUSTUP_TOOLCHAIN: 1.97.1
      FLUTTER_ROOT: ${{ github.workspace }}/target/cache/flutter
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      # 官方v6支持原锁JDK的四段版本，固定同一发行件构建号。
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-
      - name: 准备官方工具和本轮目录
        run: node .github/release.mjs prepare ios
      - name: 按本产品原锁装配普通工程
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release.mjs assemble ios
      - name: 准备原生测试输入
        run: node .github/release.mjs test-inputs ios
      - name: AI代码回归、严格分析及完整Flutter测试
        run: node .github/release.mjs test ios
      - name: 准备本轮Apple签名输入
        env:
          IOS_KEY: ${{ secrets.IOS_KEY }}
          CITIZENAPP_PROFILE: ${{ secrets.CITIZENAPP_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$WORK/signing"
          python3 - <<'PY'
          import os, pathlib, base64, re
          work = pathlib.Path(os.environ['WORK']) / 'signing'
          fields = {}
          for raw in os.environ['IOS_KEY'].splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              name, separator, value = line.partition('=')
              if not separator or name in fields or not value:
                  raise ValueError('IOS_KEY字段无效')
              fields[name] = value
          if set(fields) != {'pkcs12', 'password', 'certificate_sha1'} or not re.fullmatch('[0-9A-F]{40}', fields['certificate_sha1']):
              raise ValueError('IOS_KEY内容无效')
          (work / 'distribution.p12').write_bytes(base64.b64decode(fields['pkcs12'], validate=True))
          (work / 'password').write_text(fields['password'])
          (work / 'certificate').write_text(fields['certificate_sha1'])
          (work / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['CITIZENAPP_PROFILE'], validate=True))
          PY
          security list-keychains -d user > "$WORK/signing/keychains"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keychain="$WORK/signing/release.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$WORK/signing/distribution.p12" -k "$keychain" \
            -P "$(cat "$WORK/signing/password")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          python3 - <<'PY'
          import os, pathlib, subprocess, shlex
          directory = pathlib.Path(os.environ['WORK']) / 'signing'
          original = shlex.split((directory / 'keychains').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', str(directory / 'release.keychain-db'), *original], check=True)
          PY
          security cms -D -i "$WORK/signing/profile.mobileprovision" > "$WORK/signing/profile.plist"
          plutil -convert json -o "$WORK/signing/project.json" "$WORK/project/ios/Runner.xcodeproj/project.pbxproj"
          python3 - <<'PY'
          import os, pathlib, plistlib, hashlib, datetime, json, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          profile = plistlib.loads((directory / 'profile.plist').read_bytes())
          certificate = (directory / 'certificate').read_text()
          entitlement = profile['Entitlements']
          if profile['TeamIdentifier'] != ['MHYMVRN6FC'] or entitlement.get('application-identifier') != 'MHYMVRN6FC.ios.citizenapp' or entitlement.get('get-task-allow') is not False:
              raise ValueError('描述文件应用身份不符')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise ValueError('描述文件已过期')
          if certificate not in [hashlib.sha1(value).hexdigest().upper() for value in profile['DeveloperCertificates']]:
              raise ValueError('描述文件证书不符')
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (profile['UUID'] + '.mobileprovision')
          destination.parent.mkdir(parents=True, exist_ok=True)
          if destination.exists():
              raise ValueError('描述文件路径已占用')
          (directory / 'installed-profile').write_text(str(destination))
          shutil.copyfile(directory / 'profile.mobileprovision', destination)
          project = json.loads((directory / 'project.json').read_text())
          for obj in project['objects'].values():
              settings = obj.get('buildSettings', {})
              if obj.get('name') == 'Release' and settings.get('PRODUCT_BUNDLE_IDENTIFIER') == 'ios.citizenapp':
                  settings.update(CODE_SIGN_STYLE='Manual', DEVELOPMENT_TEAM='MHYMVRN6FC',
                      CODE_SIGN_IDENTITY='Apple Distribution', PROVISIONING_PROFILE_SPECIFIER=profile['UUID'])
          (directory / 'project.json').write_text(json.dumps(project))
          export = {'method': 'release-testing' if profile.get('ProvisionedDevices') else 'app-store-connect',
              'teamID': 'MHYMVRN6FC', 'signingStyle': 'manual', 'signingCertificate': certificate,
              'provisioningProfiles': {'ios.citizenapp': profile['UUID']}}
          (directory / 'export.plist').write_bytes(plistlib.dumps(export))
          PY
          plutil -convert xml1 -o "$WORK/project/ios/Runner.xcodeproj/project.pbxproj" "$WORK/signing/project.json"
          security find-identity -v -p codesigning "$keychain" > "$WORK/signing/identities"
          grep -Fq "$(cat "$WORK/signing/certificate")" "$WORK/signing/identities"
      - name: 编译并导出正式IPA
        id: build
        run: node .github/release.mjs compile ios
      - name: 核对iOS正式包
        run: |
          set -euo pipefail
          name="公民·iOS·v$CITIZENAPP_VERSION"
          unzip -q "$WORK/artifact/$name.ipa" -d "$WORK/verify"
          apps=("$WORK"/verify/Payload/*.app)
          test "${#apps[@]}" = 1
          app="${apps[0]}"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = ios.citizenapp
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "$CITIZENAPP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$GITHUB_RUN_NUMBER"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2> "$WORK/signing/verified"
          grep -Fxq TeamIdentifier=MHYMVRN6FC "$WORK/signing/verified"
          node --input-type=module <<'JS'
          import {readdirSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const work = process.env.WORK;
          const apps = readdirSync(work + '/verify/Payload').filter(name => name.endsWith('.app'));
          const chat = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/build.mjs'));
          await chat.verifyMls(work + '/verify/Payload/' + apps[0] + '/Frameworks/MLS.framework/MLS', 'ios');
          JS
      - name: 生成本轮正式附件说明
        run: node .github/release.mjs manifest ios
      - name: 公民·iOS·v${{ needs.version.outputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民·iOS·v${{ needs.version.outputs.version }}
          path: ${{ env.WORK }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release.mjs release ios
      # 同一 Run 上传已验 IPA，回查指定 TestFlight 内部组。
      - name: 上传正式IPA并回查TestFlight内部测试
        timeout-minutes: 30
        env:
          APPSTORE_KEYID: ${{ secrets.APPSTORE_KEYID }}
          APPSTORE_ISSUERID: ${{ secrets.APPSTORE_ISSUERID }}
          APPSTORE_PRIVATEKEY: ${{ secrets.APPSTORE_PRIVATEKEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${APPSTORE_KEYID:?缺少APPSTORE_KEYID}"
          : "${APPSTORE_ISSUERID:?缺少APPSTORE_ISSUERID}"
          : "${APPSTORE_PRIVATEKEY:?缺少APPSTORE_PRIVATEKEY}"
          # 私钥只写本轮签名现场，不进入正式附件；上传成败均立即删除。
          export API_PRIVATE_KEYS_DIR="$WORK/signing/appstore"
          mkdir "$API_PRIVATE_KEYS_DIR"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          printf '%s\n' "$APPSTORE_PRIVATEKEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_KEYID.p8"
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {sign} from 'node:crypto';
          import {setTimeout as pause} from 'node:timers/promises';
          const env = process.env;
          const app = '6800953222';
          const group = 'c4a947eb-db0b-45ee-ad1d-6d306d77b968';
          const base = 'https://api.appstoreconnect.apple.com';
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          async function request(path, body) {
            const now = Math.floor(Date.now() / 1000);
            const input = encode({alg: 'ES256', kid: env.APPSTORE_KEYID, typ: 'JWT'}) + '.' +
              encode({iss: env.APPSTORE_ISSUERID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1'});
            const token = input + '.' + sign('sha256', Buffer.from(input),
              {key: env.APPSTORE_PRIVATEKEY, dsaEncoding: 'ieee-p1363'}).toString('base64url');
            const response = await fetch(base + path, {
              method: body === undefined ? 'GET' : 'POST', redirect: 'error',
              headers: {Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', Connection: 'close'},
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw Error('App Store Connect 回查或分发失败，HTTP ' + response.status);
            return response.status === 204 ? null : response.json();
          }
          const info = await request('/v1/apps/' + app);
          if (info.data?.attributes?.bundleId !== 'ios.citizenapp') throw Error('TestFlight 应用标识不符');
          const groups = await request('/v1/apps/' + app + '/betaGroups?limit=200');
          const target = groups.data?.find(row => row.id === group);
          if (target?.attributes?.isInternalGroup !== true) {
            throw Error('公民 TestFlight 内部组归属不符');
          }
          if (groups.links?.next || groups.data.some(row => row.id !== group &&
              row.attributes?.isInternalGroup === true && row.attributes.hasAccessToAllBuilds !== false)) {
            throw Error('无法保证仅分发到「公民」：其他内部组可能自动接收构建');
          }
          execFileSync('xcrun', ['altool', '--upload-package',
            env.WORK + '/artifact/公民·iOS·v' + env.CITIZENAPP_VERSION + '.ipa',
            '--api-key', env.APPSTORE_KEYID, '--api-issuer', env.APPSTORE_ISSUERID,
            '--wait', '--output-format', 'json'], {stdio: 'inherit'});
          const filters = new URLSearchParams({
            'filter[app]': app, 'filter[version]': env.GITHUB_RUN_NUMBER, include: 'preReleaseVersion'
          });
          const groupBuilds = '/v1/betaGroups/' + group + '/relationships/builds';
          let assigned = false, verified = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            if (attempt) await pause(10000);
            const result = await request('/v1/builds?' + filters);
            const builds = result.data.filter(row => {
              const prerelease = result.included?.find(item => item.type === 'preReleaseVersions' &&
                item.id === row.relationships?.preReleaseVersion?.data?.id);
              return row.attributes?.version === env.GITHUB_RUN_NUMBER &&
                prerelease?.attributes?.version === env.CITIZENAPP_VERSION && prerelease.attributes.platform === 'IOS';
            });
            if (builds.length > 1) throw Error('本轮 TestFlight 构建不唯一');
            const build = builds[0];
            if (!build) continue;
            if (build.attributes.expired || ['FAILED', 'INVALID'].includes(build.attributes.processingState)) {
              throw Error('本轮 TestFlight 构建处理失败或已过期');
            }
            if (build.attributes.processingState !== 'VALID') continue;
            const detail = await request('/v1/builds/' + encodeURIComponent(build.id) + '/buildBetaDetail');
            const state = detail.data?.attributes?.internalBuildState;
            if (['PROCESSING_EXCEPTION', 'MISSING_EXPORT_COMPLIANCE', 'IN_EXPORT_COMPLIANCE_REVIEW', 'EXPIRED'].includes(state)) {
              throw Error('本轮 TestFlight 构建不可内测：' + state);
            }
            if (state !== 'READY_FOR_BETA_TESTING' && state !== 'IN_BETA_TESTING') continue;
            const membership = await request(groupBuilds + '?limit=200');
            const present = membership.data.some(row => row.id === build.id && row.type === 'builds');
            if (present && state === 'IN_BETA_TESTING') {
              verified = true;
              break;
            }
            if (!present && !assigned && target.attributes.hasAccessToAllBuilds !== true) {
              if (membership.links?.next) throw Error('无法确认本轮 TestFlight 构建的内部组归属');
              await request(groupBuilds, {data: [{type: 'builds', id: build.id}]});
              assigned = true;
            }
          }
          if (!verified) throw Error('本轮 TestFlight 内部组回查超时');
          console.log('本轮 TestFlight 构建已在「公民」内部组可测试');
          NODE
      - name: 保存官方增量缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮普通现场和签名输入
        if: always()
        run: node .github/release.mjs cleanup-work ios
  cleanup:
    name: 公民·iOS·收尾
    needs: [version, compile]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '25.2.1'
          check-latest: false
      - name: 清理本平台旧记录并回查
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.version.result == 'success' && needs.compile.result == 'success' && 'success' || 'failure' }}
        run: node .github/release.mjs cleanup ios
