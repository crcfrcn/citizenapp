# 一个产品平台一次执行只有一个Run，所有产品执行归本仓Workflow。
name: 公民·iOS
run-name: 公民·iOS·v${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 由最新有效成功版本计算的候选版本，失败不占号
        required: true
        type: string
concurrency:
  group: citizenapp-ios
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
defaults:
  run:
    shell: bash
env:
  PLATFORM: ios
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  compile:
    if: github.ref == 'refs/heads/main' && github.repository == 'crcfrcn/citizenapp'
    name: 公民·iOS·v${{ inputs.version }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: ''
      CITIZENAPP_VERSION: ${{ inputs.version }}
      CITIZENAPP_SOURCE_ROOT: ${{ github.workspace }}
      PUB_CACHE: ${{ github.workspace }}/target/cache/pub
      GRADLE_USER_HOME: ${{ github.workspace }}/target/cache/gradle
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cache/rust
      RUSTUP_TOOLCHAIN: 1.97.1
      FLUTTER_ROOT: ${{ github.workspace }}/target/cache/flutter
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 核对候选版本及唯一原Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const version = process.env.CITIZENAPP_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw Error('候选版本无效');
          const pages = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', 'repos/' + process.env.GITHUB_REPOSITORY + '/actions/workflows/' + process.env.PLATFORM + '.yml/runs?branch=main&event=workflow_dispatch&per_page=100'], {encoding: 'utf8'}));
          const rows = pages.flatMap(page => page.workflow_runs).filter(run => String(run.id) !== process.env.GITHUB_RUN_ID);
          if (rows.some(run => run.status !== 'completed' && run.id < Number(process.env.GITHUB_RUN_ID))) throw Error('存在更早活动Run');
          const success = rows.filter(run => run.status === 'completed' && run.conclusion === 'success').sort((a,b) => b.id - a.id)[0];
          let expected = /^version: ([^+\s]+)/m.exec(readFileSync('pubspec.yaml', 'utf8'))?.[1];
          if (success) {
              const prefix = '公民·' + (process.env.PLATFORM === 'ios' ? 'iOS' : 'Android') + '·v';
              if (!success.display_title.startsWith(prefix)) throw Error('成功Run缺少准确版本');
              const parts = success.display_title.slice(prefix.length).split('.');
              if (parts.length !== 3 || parts.some(value => !/^(0|[1-9]\d*)$/.test(value))) throw Error('成功版本无效');
              parts[2] = String(BigInt(parts[2]) + 1n);
              expected = parts.join('.');
          }
          if (version !== expected) throw Error('候选版本已变化，禁止编译');
          JS
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      # 官方v6支持原锁JDK的四段版本，固定同一发行件构建号。
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-
      - name: 准备官方工具和本轮目录
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" target/cache
          echo "WORK=$work" >> "$GITHUB_ENV"
          if [ ! -d "$FLUTTER_ROOT/.git" ]; then
            git clone --branch 3.47.2 --depth 1 https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" --version --machine | jq -e '.frameworkVersion=="3.47.2"' >/dev/null
          # 原锁CitizenSDK的Apple入口同时消费iOS和macOS Release引擎。
          "$FLUTTER_ROOT/bin/flutter" precache --ios --macos
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-apple-ios aarch64-apple-ios-sim
          gem install cocoapods -v 1.17.0 --no-document --install-dir "$work/gems"
          echo "GEM_HOME=$work/gems" >> "$GITHUB_ENV"
          echo "$work/gems/bin" >> "$GITHUB_PATH"
          # 复用官方运行机SDK，显式路径不依赖交互Shell的初始化。
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
      - name: 按本产品原锁装配普通工程
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync, cpSync, copyFileSync, readFileSync, writeFileSync, readdirSync, appendFileSync, chmodSync, rmSync} from 'node:fs';
          import {join, dirname} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const root = process.env.GITHUB_WORKSPACE, work = process.env.WORK;
          const project = join(work, 'project');
          mkdirSync(project);
          for (const entry of readdirSync(root)) {
              if (['target', '.git', '.dart_tool', 'build', '.gradle'].includes(entry)) continue;
              cpSync(join(root, entry), join(project, entry), {recursive: true});
          }
          let declaration = readFileSync(join(project, 'pubspec.yaml'), 'utf8');
          let lock = readFileSync(join(project, 'pubspec.lock'), 'utf8');
          for (const name of ['citizen_sdk', 'tatachat_sdk']) {
              const record = lock.split('\n  ' + name + ':\n')[1]?.split(/\n  \S/)[0];
              const ref = /resolved-ref: ([a-f0-9]{40})/.exec(record || '')?.[1];
              const url = /url: "?(https:\/\/github.com\/[^"\s]+\.git)"?/.exec(record || '')?.[1];
              const declared = declaration.split('  ' + name + ':\n')[1]?.split(/\n  \S/)[0];
              if (!ref || !url || !declared?.includes(url) || !declared.includes('ref: ' + ref)) {
                  throw Error('SDK声明与原锁来源不一致');
              }
              const source = join(work, 'sources', name), output = join(work, 'packages', name);
              mkdirSync(source, {recursive: true});
              execFileSync('git', ['init', source]);
              execFileSync('git', ['-C', source, 'fetch', '--depth=1', url, ref]);
              execFileSync('git', ['-C', source, 'checkout', '--detach', 'FETCH_HEAD']);
              mkdirSync(dirname(output), {recursive: true});
              const sdk = await import(pathToFileURL(join(source, 'scripts/build.mjs')));
              sdk.createFlutterSourceView(source, output);
              sdk.assertFlutterSourceView(source, output);
              declaration = declaration.replace(new RegExp('  ' + name + ':\\n(?:    .*\\n)+'), '  ' + name + ':\n    path: ' + output + '\n');
              lock = lock.replace(new RegExp('  ' + name + ':\\n(?:    .*\\n)+'), entry => {
                  const version = /    version: .+/.exec(entry)?.[0];
                  return '  ' + name + ':\n    dependency: "direct main"\n    description:\n      path: "' + output +
                      '"\n      relative: false\n    source: path\n' + version + '\n';
              });
          }
          writeFileSync(join(project, 'pubspec.yaml'), declaration);
          writeFileSync(join(project, 'pubspec.lock'), lock);
          // Flutter官方模板只写本轮工程；保留既有业务源码和平台工程原件。
          const flutter = join(process.env.FLUTTER_ROOT, 'bin/flutter');
          execFileSync(flutter, ['create', '--no-pub', '--platforms=android,ios', '--org=com.crcfrcn', '--project-name=citizenapp', project], {stdio: 'inherit'});
          // 只排除模板新增的示例；产品原有同名测试必须保留。
          if (!readdirSync(join(root, 'test')).includes('widget_test.dart')) rmSync(join(project, 'test/widget_test.dart'), {force: true});
          const write = (path, text) => {
              mkdirSync(dirname(join(project, path)), {recursive: true});
              writeFileSync(join(project, path), text);
          };
          const copy = (source, destination) => {
              mkdirSync(dirname(join(project, destination)), {recursive: true});
              copyFileSync(join(root, source), join(project, destination));
          };
          // 移除模板入口，唯一原生入口来自本产品已提交源码。
          rmSync(join(project, 'android/app/src/main/kotlin'), {recursive: true, force: true});
          for (const name of ['MainActivity', 'SquareMediaChannel', 'SquareMp4FastStart', 'SquareVideoTranscoder']) {
              const source = name === 'MainActivity' ? 'app' : 'square';
              copy('android/' + source + '/' + name + '.kt', 'android/app/src/main/' + name + '.kt');
          }
          copy('android/app/AndroidManifest.xml', 'android/app/src/main/AndroidManifest.xml');
          copy('android/app/InstrumentedTests.kt', 'android/app/src/androidTest/InstrumentedTests.kt');
          copy('ios/project/Runner.pbxproj', 'ios/Runner.xcodeproj/project.pbxproj');
          copy('ios/project/Runner.xcscheme', 'ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme');
          for (const name of ['AppDelegate.swift', 'SystemProtectedDataChannel.swift', 'Info.plist', 'InfoPlist.xcstrings']) {
              copy('ios/source/' + name, 'ios/Runner/' + name);
          }
          for (const name of ['SquareMediaChannel', 'SquareVideoTranscoder']) copy('ios/square/' + name + '.swift', 'ios/Runner/' + name + '.swift');
          for (const name of ['RunnerTests', 'RunnerUITests']) copy('ios/tests/' + name + '.swift', 'ios/' + name + '.swift');
          // 以下仅为本轮平台工具直接消费的必要配置，不生成常驻模块。
          write("android/build.gradle.kts", `// App与Flutter插件共用官方AGP/KGP；不改写插件缓存或另建工具链。
          plugins {
              id("com.android.application") version "9.0.1" apply false
              id("com.android.library") version "9.0.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }
          allprojects {
              repositories { google(); mavenCentral() }
              plugins.withId("com.android.library") {
                  // 原锁CitizenSDK声明Kotlin源；宿主选择旧KGP时为该模块应用同一插件。
                  if (project.name == "citizen_sdk") { pluginManager.apply("org.jetbrains.kotlin.android") }
                  if (project.name == "camera_android_camerax") {
                      dependencies.add("implementation", "androidx.concurrent:concurrent-futures:1.2.0")
                  }
              }
          }
          rootProject.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir("../build"))
          subprojects {
              layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(name))
              evaluationDependsOn(":app")
          }
          tasks.register<Delete>("clean") { delete(rootProject.layout.buildDirectory) }
          `);
          write("android/settings.gradle.kts", `pluginManagement {
              val properties = java.util.Properties()
              file("local.properties").inputStream().use { properties.load(it) }
              val flutterSdkPath = properties.getProperty("flutter.sdk") ?: error("flutter.sdk未配置")
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          plugins { id("dev.flutter.flutter-plugin-loader") version "1.0.0" }
          include(":app")
          `);
          write("android/gradle.properties", `org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m
          android.useAndroidX=true
          # Flutter 3.47与当前原锁插件使用官方支持的KGP和DSL配置，不修补Flutter源码。
          android.builtInKotlin=false
          android.newDsl=false
          `);
          write("android/gradle/wrapper/gradle-wrapper.properties", `distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
          distributionSha256Sum=a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806
          `);
          write("android/app/src/main/res/xml/network_security_config.xml", `<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <!-- 生产全部走 HTTPS / WSS（TLS）：cid、square/chain-bootstrap Worker、
                   GitHub 更新和 CitizenSDK 公民链节点。
                   默认阻断一切明文流量，防中间人（iOS 侧由默认 ATS 同等阻断）。 -->
              <base-config cleartextTrafficPermitted="false" />
          </network-security-config>
          `);
          write("android/app/src/main/res/xml/update_file_paths.xml", `<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="citizenapp_update_cache"
                  path="." />
          </paths>
          `);
          write("ios/Podfile", `platform :ios, '16.0'

          # CocoaPods analytics sends network stats synchronously affecting flutter build latency.
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            # Swift 插件统一以 framework 集成，避免静态模块映射与 Objective-C 桥接头冲突。
            use_frameworks!

            # TataChatSDK 通过自身 Flutter FFI plugin 和 tatachat_sdk.podspec 自动安装；宿主
            # Podfile 不直接登记其 Rust 库，避免恢复跨产品链接所有权。

            # 保留调用方源码外工程视图的词法路径；Podfile可以是只读链接，
            # realpath会跳回产品源码并把Pods/.symlinks误写进源码目录。
            flutter_install_all_ios_pods File.dirname(File.expand_path(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                # Apple Silicon simulator requires arm64. Do not exclude it.
                config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = ''
                # 两个 iOS 产品统一以 16.0 为唯一最低版本，禁止 Pods 保留 9/11/12/13 的旧目标。
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              end
            end

            # CocoaPods 1.17 会把 Isar 静态 XCFramework 的脚本输出误写成不存在的
            # \`isar.framework\`，实际切片是 \`libisar.a\`。Xcode 27 据此建立错误依赖图，
            # 可能在复制静态库前启动链接器。这里只修正每次 pod install 的生成清单，
            # 不修改 pub cache、Isar 源码或引入手工预构建流程。
            isar_support_dir = File.join(
              installer.sandbox.root.to_s,
              'Target Support Files',
              'isar_community_flutter_libs',
            )
            isar_output_list = File.join(
              isar_support_dir,
              'isar_community_flutter_libs-xcframeworks-output-files.xcfilelist',
            )
            File.write(
              isar_output_list,
              "\${PODS_XCFRAMEWORKS_BUILD_DIR}/isar_community_flutter_libs/libisar.a\\n",
            )
          end
          `);
          write("ios/Runner/Base.lproj/CitizenLaunchScreen.storyboard", `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="12121" systemVersion="16G29" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="12089"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <layoutGuides>
                                  <viewControllerLayoutGuide type="top" id="Ydg-fD-yQy"/>
                                  <viewControllerLayoutGuide type="bottom" id="xbc-2k-c8Z"/>
                              </layoutGuides>
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <imageView opaque="NO" clipsSubviews="YES" contentMode="center" image="CitizenLaunchLogo" translatesAutoresizingMaskIntoConstraints="NO" id="YRO-k0-Ey4"/>
                                  </subviews>
                                  <color key="backgroundColor" red="1" green="1" blue="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                  <constraints>
                                      <constraint firstItem="YRO-k0-Ey4" firstAttribute="centerX" secondItem="Ze5-6b-2t3" secondAttribute="centerX" id="1a2-6s-vTC"/>
                                      <constraint firstItem="YRO-k0-Ey4" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" id="4X2-HB-R7a"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
              <resources>
                  <image name="CitizenLaunchLogo" width="160" height="160"/>
              </resources>
          </document>
          `);
          write("ios/Runner/Runner.entitlements", `<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <!-- 这里只声明请求值；最终 APNs 环境以签名 provisioning profile 为唯一真源。 -->
              <key>aps-environment</key>
              <string>$(APS_ENVIRONMENT)</string>
          </dict>
          </plist>
          `);
          write("android/app/src/main/res/values/strings.xml", `<resources>
              <string name="app_name">公民</string>
          </resources>
          `);
          write("android/app/src/main/res/values-en/strings.xml", `<resources>
              <string name="app_name">CitizenApp</string>
          </resources>
          `);
          write("android/app/src/main/res/values/colors.xml", `<resources>
              <color name="ic_launcher_background">#18787D</color>
          </resources>
          `);
          write("android/app/src/main/res/drawable/launch_background.xml", `<?xml version="1.0" encoding="utf-8"?>
          <!-- Modify this file to customize your launch splash screen -->
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />

              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@mipmap/launch_image" />
              </item>
          </layer-list>
          `);
          write("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", `<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          `);
          write("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", `<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          `);
          write("android/app/src/main/res/values/styles.xml", `<resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          `);
          write("android/app/src/main/res/values-night/styles.xml", `<resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          `);
          write("ios/Runner/Runner-Bridging-Header.h", `#import "GeneratedPluginRegistrant.h"
          `);
          write("ios/Runner/Assets.xcassets/CitizenLaunchLogo.imageset/Contents.json", `{
            "images": [
              {
                "filename": "CitizenLaunchLogo.png",
                "idiom": "universal",
                "scale": "1x"
              },
              {
                "filename": "CitizenLaunchLogo@2x.png",
                "idiom": "universal",
                "scale": "2x"
              },
              {
                "filename": "CitizenLaunchLogo@3x.png",
                "idiom": "universal",
                "scale": "3x"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          `);
          for (const [density, icon, foreground, launch] of [['mdpi',48,108,120], ['hdpi',72,162,180], ['xhdpi',96,216,240], ['xxhdpi',144,324,360], ['xxxhdpi',192,432,480]]) {
              const destination = 'android/app/src/main/res/mipmap-' + density + '/';
              for (const name of ['ic_launcher', 'ic_launcher_round']) copy('assets/logo/icon' + icon + '.png', destination + name + '.png');
              copy('assets/logo/foreground' + foreground + '.png', destination + 'ic_launcher_foreground.png');
              copy('assets/logo/launch' + launch + '.png', destination + 'launch_image.png');
          }
          write('android/app/src/main/res/drawable-v21/launch_background.xml', readFileSync(join(project, 'android/app/src/main/res/drawable/launch_background.xml'), 'utf8'));
          const iconSet = 'ios/Runner/Assets.xcassets/AppIcon.appiconset/';
          const icons = JSON.parse(readFileSync(join(project, iconSet, 'Contents.json')));
          for (const image of icons.images) {
              if (!image.filename) continue;
              const size = Number(image.size.split('x')[0]) * Number(image.scale.replace('x', ''));
              copy('assets/logo/icon' + size + '.png', iconSet + image.filename);
          }
          for (const [scale, suffix] of [[1,''], [2,'@2x'], [3,'@3x']]) copy('assets/logo/launch' + 160 * scale + '.png', 'ios/Runner/Assets.xcassets/CitizenLaunchLogo.imageset/CitizenLaunchLogo' + suffix + '.png');
          writeFileSync(join(project, 'analysis_options.yaml'), 'include: package:flutter_lints/flutter.yaml\nanalyzer:\n  exclude:\n    - build/**\n    - android/**\n    - ios/**\n');
          chmodSync(join(project, 'android/gradlew'), 0o755);
          const citizen = join(work, 'sources/citizen_sdk/scripts/build.mjs');
          const source = join(work, 'citizen-sources');
          execFileSync(process.execPath, [citizen, 'prepare-environment', '--platform', 'macOS', '--work', source], {stdio: 'inherit'});
          const plan = JSON.parse(execFileSync(process.execPath, [citizen, 'plan', '--platform', 'macOS'], {encoding: 'utf8'}));
          const qr = plan.archives.filter(entry => /zxing/i.test(entry.name));
          if (qr.length !== 1) throw Error('SDK公开QR来源不唯一');
          const values = {
              CITIZENSDK_WORK_DIR: join(work, 'native-work'),
              CITIZENSDK_NATIVE_OUTPUT_DIR: join(work, 'native'),
              CITIZENSDK_ZXING_SOURCE_DIR: join(source, qr[0].archive_root),
              CITIZENSDK_GRADLE: join(project, 'android/gradlew'),
              CITIZENSDK_ANDROID_CORE_DIR: join(work, 'native/android/arm64-v8a'),
              CITIZENSDK_ANDROID_BUILD_DIR: join(work, 'citizen-android'),
              CITIZENSDK_TEST_CORE_LIB_PATH: join(work, 'native/abi-host/libcitizensdk.dylib'),
              TATACHATSDK_TEST_WORK_ROOT: work,
              TATACHATSDK_TEST_NATIVE_LIBRARY: join(work, 'packages/tatachat_sdk/native/libtatachat_sdk.dylib')
          };
          for (const [key, value] of Object.entries(values)) appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          JS
      - name: 编译本轮原生依赖
        run: node scripts/build.mjs ios dependencies
      - name: 准备原生测试输入
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = ios ]; then
            cp -R "$WORK/native/apple/CitizenSDK.xcframework" "$WORK/packages/citizen_sdk/darwin/"
          fi
          cd "$WORK/project"
          flutter pub get --enforce-lockfile
          node --input-type=module <<'JS'
          import {readFileSync, copyFileSync, appendFileSync} from 'node:fs';
          import {fileURLToPath} from 'node:url';
          const file = new URL('file://' + process.cwd() + '/.dart_tool/package_config.json');
          const entry = JSON.parse(readFileSync(file)).packages.find(row => row.name === 'isar_community_flutter_libs');
          if (!entry) throw Error('原锁缺少Isar');
          const library = process.env.WORK + '/libisar.dylib';
          copyFileSync(fileURLToPath(new URL('macos/libisar.dylib', new URL(entry.rootUri, file))), library);
          appendFileSync(process.env.GITHUB_ENV, 'ISAR_CORE_LIB_PATH=' + library + '\n');
          JS
          git clone --filter=blob:none --sparse --depth=1 https://github.com/crcfrcn/citizenchain.git "$WORK/chain"
          git -C "$WORK/chain" sparse-checkout set runtime/primitives/tests/fixtures
          git -C "$WORK/chain" rev-parse HEAD > "$WORK/chain-source-sha"
          echo "CITIZENCHAIN_ROOT=$WORK/chain" >> "$GITHUB_ENV"
      - name: AI代码回归、严格分析及完整Flutter测试
        run: |
          set -euo pipefail
          node --test test/release_manifest.test.mjs
          cd "$WORK/project"
          flutter analyze --fatal-infos --fatal-warnings --no-pub
          flutter test --no-pub --concurrency=1 --fail-fast --reporter=json | tee "$WORK/flutter-report.jsonl"
          node --input-type=module <<'JS'
          import {readFileSync, readdirSync} from 'node:fs';
          const events = readFileSync(process.env.WORK + '/flutter-report.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          const starts = new Set(events.filter(row => row.type === 'testStart').map(row => row.test.id));
          const ended = events.filter(row => row.type === 'testDone');
          const done = events.filter(row => row.type === 'done');
          const walk = path => readdirSync(path, {withFileTypes: true}).flatMap(entry =>
              entry.isDirectory() ? walk(path + '/' + entry.name) : [path + '/' + entry.name]);
          const expected = walk(process.cwd() + '/test').filter(path => path.endsWith('_test.dart'));
          const loaded = events.filter(row => row.type === 'suite').map(row => row.suite.path);
          if (!starts.size || done.length !== 1 || done[0].success !== true || ended.length !== starts.size ||
              ended.some(row => row.skipped || row.result !== 'success') || expected.some(path => !loaded.includes(path))) {
              throw Error('Flutter全量回归失败、跳过或不完整');
          }
          JS
      - name: 准备本轮Apple签名输入
        env:
          IOS_KEY: ${{ secrets.IOS_KEY }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$WORK/signing"
          python3 - <<'PY'
          import os, pathlib, base64, re
          work = pathlib.Path(os.environ['WORK']) / 'signing'
          fields = {}
          for raw in os.environ['IOS_KEY'].splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              name, separator, value = line.partition('=')
              if not separator or name in fields or not value:
                  raise ValueError('IOS_KEY字段无效')
              fields[name] = value
          if set(fields) != {'pkcs12', 'password', 'certificate_sha1'} or not re.fullmatch('[0-9A-F]{40}', fields['certificate_sha1']):
              raise ValueError('IOS_KEY内容无效')
          (work / 'distribution.p12').write_bytes(base64.b64decode(fields['pkcs12'], validate=True))
          (work / 'password').write_text(fields['password'])
          (work / 'certificate').write_text(fields['certificate_sha1'])
          (work / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['APP_PROFILE'], validate=True))
          PY
          security list-keychains -d user > "$WORK/signing/keychains"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          keychain="$WORK/signing/release.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$WORK/signing/distribution.p12" -k "$keychain" \
            -P "$(cat "$WORK/signing/password")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          python3 - <<'PY'
          import os, pathlib, subprocess, shlex
          directory = pathlib.Path(os.environ['WORK']) / 'signing'
          original = shlex.split((directory / 'keychains').read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', str(directory / 'release.keychain-db'), *original], check=True)
          PY
          security cms -D -i "$WORK/signing/profile.mobileprovision" > "$WORK/signing/profile.plist"
          plutil -convert json -o "$WORK/signing/project.json" "$WORK/project/ios/Runner.xcodeproj/project.pbxproj"
          python3 - <<'PY'
          import os, pathlib, plistlib, hashlib, datetime, json, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          profile = plistlib.loads((directory / 'profile.plist').read_bytes())
          certificate = (directory / 'certificate').read_text()
          entitlement = profile['Entitlements']
          if profile['TeamIdentifier'] != ['MHYMVRN6FC'] or entitlement.get('application-identifier') != 'MHYMVRN6FC.ios.citizenapp' or entitlement.get('get-task-allow') is not False:
              raise ValueError('描述文件应用身份不符')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise ValueError('描述文件已过期')
          if certificate not in [hashlib.sha1(value).hexdigest().upper() for value in profile['DeveloperCertificates']]:
              raise ValueError('描述文件证书不符')
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (profile['UUID'] + '.mobileprovision')
          destination.parent.mkdir(parents=True, exist_ok=True)
          if destination.exists():
              raise ValueError('描述文件路径已占用')
          (directory / 'installed-profile').write_text(str(destination))
          shutil.copyfile(directory / 'profile.mobileprovision', destination)
          project = json.loads((directory / 'project.json').read_text())
          for obj in project['objects'].values():
              settings = obj.get('buildSettings', {})
              if obj.get('name') == 'Release' and settings.get('PRODUCT_BUNDLE_IDENTIFIER') == 'ios.citizenapp':
                  settings.update(CODE_SIGN_STYLE='Manual', DEVELOPMENT_TEAM='MHYMVRN6FC',
                      CODE_SIGN_IDENTITY='Apple Distribution', PROVISIONING_PROFILE_SPECIFIER=profile['UUID'])
          (directory / 'project.json').write_text(json.dumps(project))
          export = {'method': 'release-testing' if profile.get('ProvisionedDevices') else 'app-store-connect',
              'teamID': 'MHYMVRN6FC', 'signingStyle': 'manual', 'signingCertificate': certificate,
              'provisioningProfiles': {'ios.citizenapp': profile['UUID']}}
          (directory / 'export.plist').write_bytes(plistlib.dumps(export))
          PY
          plutil -convert xml1 -o "$WORK/project/ios/Runner.xcodeproj/project.pbxproj" "$WORK/signing/project.json"
          security find-identity -v -p codesigning "$keychain" > "$WORK/signing/identities"
          grep -Fq "$(cat "$WORK/signing/certificate")" "$WORK/signing/identities"
      - name: 编译并导出正式IPA
        id: build
        run: node scripts/build.mjs ios
      - name: 核对iOS正式包
        run: |
          set -euo pipefail
          name="公民·iOS·v$CITIZENAPP_VERSION"
          unzip -q "$WORK/artifact/$name.ipa" -d "$WORK/verify"
          apps=("$WORK"/verify/Payload/*.app)
          test "${#apps[@]}" = 1
          app="${apps[0]}"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = ios.citizenapp
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "$CITIZENAPP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$GITHUB_RUN_NUMBER"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2> "$WORK/signing/verified"
          grep -Fxq TeamIdentifier=MHYMVRN6FC "$WORK/signing/verified"
          node --input-type=module <<'JS'
          import {readdirSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const work = process.env.WORK;
          const apps = readdirSync(work + '/verify/Payload').filter(name => name.endsWith('.app'));
          const sdk = await import(pathToFileURL(work + '/sources/tatachat_sdk/scripts/build.mjs'));
          await sdk.verifyNative(work + '/verify/Payload/' + apps[0] + '/Frameworks/TataChatSDK.framework/TataChatSDK', 'ios');
          JS
      - name: 生成本轮正式附件说明
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, writeFileSync, readdirSync, statSync} from 'node:fs';
          const work = process.env.WORK, title = '公民·iOS·v' + process.env.CITIZENAPP_VERSION;
          const directory = work + '/artifact';
          const digest = file => execFileSync('shasum', ['-a', '256', file], {encoding: 'utf8'}).split(' ')[0];
          const asset = name => ({name, size: statSync(directory + '/' + name).size, sha256: digest(directory + '/' + name)});
          const proof = {
              schema: 1, product_id: 'citizenapp', platform: process.env.PLATFORM,
              version: process.env.CITIZENAPP_VERSION, version_code: Number(process.env.GITHUB_RUN_NUMBER),
              source_sha: process.env.GITHUB_SHA, run_id: Number(process.env.GITHUB_RUN_ID),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              chain_test_sha: readFileSync(work + '/chain-source-sha', 'utf8').trim(),
              assets: readdirSync(directory).sort().map(asset)
          };
          const name = title + '.json';
          writeFileSync(directory + '/' + name, JSON.stringify(proof, null, 2) + '\n');
          proof.assets.push(asset(name));
          writeFileSync(work + '/proof.json', JSON.stringify(proof, null, 2) + '\n');
          JS
      - name: 公民·iOS·v${{ inputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民·iOS·v${{ inputs.version }}
          path: ${{ env.WORK }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="公民·iOS·v$CITIZENAPP_VERSION"
          encoded="$(jq -nr --arg value "$name" '$value|@uri')"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$WORK/releases.json"
          old="$(jq -c --arg tag "$name" '[.[][]|select(.tag_name==$tag)]' "$WORK/releases.json")"
          test "$(jq 'length' <<< "$old")" -le 1
          if [ "$(jq 'length' <<< "$old")" = 1 ]; then
            proof="$(jq -r '.[0].body' <<< "$old")"
            jq -e --arg version "$CITIZENAPP_VERSION" '.product_id=="citizenapp" and .platform=="ios" and .version==$version' <<< "$proof" >/dev/null
            previous_run="$(jq -r .run_id <<< "$proof")"
            previous_attempt="$(jq -r .run_attempt <<< "$proof")"
            previous_sha="$(jq -r .source_sha <<< "$proof")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/attempts/$previous_attempt" \
              | jq -e --arg sha "$previous_sha" '.status=="completed" and .conclusion!="success" and .head_sha==$sha and .path==".github/workflows/ios.yml"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
              | jq -e --arg sha "$previous_sha" '.object.type=="commit" and .object.sha==$sha' >/dev/null
            gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # 未登记的同名Tag绝不覆盖。只有本轮新建对象可被失败回滚删除。
          export CITIZENAPP_RELEASE_NAME="$name"
          tag_created=false
          rollback() {
            code=$?
            if [ "$code" != 0 ]; then
              # gh创建成功但附件上传失败也可能留下草稿，按本Run证明准确查回。
              owned="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name==env.CITIZENAPP_RELEASE_NAME and .target_commitish==env.GITHUB_SHA)|select((.body|fromjson?|.run_id)==(env.GITHUB_RUN_ID|tonumber))|.id')" || echo '本次Release查询未完成' >&2
              if [[ "${owned:-}" =~ ^[1-9][0-9]*$ ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$owned" || echo '本次Release撤销未完成' >&2
              fi
              if [ "$tag_created" = true ]; then
                if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null; then
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded" || echo '本次Tag撤销未完成' >&2
                else
                  echo '本次Tag归属或撤销状态未确认' >&2
                fi
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$name" -f "sha=$GITHUB_SHA" > "$WORK/tag.json"
          tag_created=true
          assets=()
          for file in "$WORK/artifact/"*; do assets+=("$file#$(basename "$file")"); done
          gh release create "$name" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "$name" --notes-file "$WORK/proof.json" --draft
          gh release view "$name" --repo "$GITHUB_REPOSITORY" --json assets > "$WORK/assets.json"
          mkdir "$WORK/readback"
          for file in "$WORK/artifact/"*; do
            label="$(basename "$file")"
            remote="$(jq -er --arg label "$label" '[.assets[]|select(.label==$label)]|if length==1 then .[0].name else error("附件标签不唯一") end' "$WORK/assets.json")"
            gh release download "$name" --repo "$GITHUB_REPOSITORY" --pattern "$remote" --output "$WORK/readback/$label"
            cmp "$file" "$WORK/readback/$label"
          done
          gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" --arg tag "$name" '.draft==false and .prerelease==false and .published_at!=null and .name==$tag and .tag_name==$tag and .target_commitish==$sha and (.assets|length)==2' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          trap - EXIT
      - name: 保存官方增量缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮普通现场和签名输入
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${WORK:-}" ]; then exit 0; fi
          test "$WORK" = "$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          if (work / 'build-active.json').exists():
              raise RuntimeError('编译进程退出未确认，保留现场')
          if (directory / 'keychains').exists():
              original = shlex.split((directory / 'keychains').read_text())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *original], check=True)
          if (directory / 'release.keychain-db').exists():
              subprocess.run(['security', 'delete-keychain', str(directory / 'release.keychain-db')], check=True)
          if (directory / 'installed-profile').exists():
              pathlib.Path((directory / 'installed-profile').read_text()).unlink(missing_ok=True)
          shutil.rmtree(work)
          PY
