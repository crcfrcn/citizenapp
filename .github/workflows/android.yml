# 一个产品平台一次执行只有一个Run，所有产品执行归本仓Workflow。
name: 公民·Android
run-name: 公民·Android·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: citizenapp-android
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
defaults:
  run:
    shell: bash
env:
  PLATFORM: android
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  version:
    name: 公民·Android·版本
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '25.2.1'
          check-latest: false
      - id: version
        name: 计算本Run版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" > "$RUNNER_TEMP/previous.json"
          node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let version=/^version:\s*([^+\s]+)/mu.exec(readFileSync('pubspec.yaml','utf8'))[1];
          const previous=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/previous.json','utf8')).workflow_runs[0];
          if(previous){
            const data=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+previous.id+'/artifacts?per_page=100'],{encoding:'utf8'}));
            const prefix="公民·Android·v";
            const artifact=data.artifacts.find(value=>value.name.startsWith(prefix)&&/^\d+\.\d+\.\d+$/u.test(value.name.slice(prefix.length)));
            const parts=artifact.name.slice(prefix.length).split('.');parts[2]=String(BigInt(parts[2])+1n);version=parts.join('.');
          }
          console.log('version='+version);
          NODE
  compile:
    needs: version
    if: github.ref == 'refs/heads/main' && github.repository == 'crcfrcn/citizenapp'
    name: 公民·Android·v${{ needs.version.outputs.version }}
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: ''
      CITIZENAPP_VERSION: ${{ needs.version.outputs.version }}
      CITIZENAPP_SOURCE_ROOT: ${{ github.workspace }}
      PUB_CACHE: ${{ github.workspace }}/target/cache/pub
      GRADLE_USER_HOME: ${{ github.workspace }}/target/cache/gradle
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cache/rust
      RUSTUP_TOOLCHAIN: 1.97.1
      FLUTTER_ROOT: ${{ github.workspace }}/target/cache/flutter
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      # 官方v6支持原锁JDK的四段版本，固定同一发行件构建号。
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizenapp-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-
      - name: 准备官方工具和本轮目录
        run: |
          set -euo pipefail
          work="$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work" target/cache
          echo "WORK=$work" >> "$GITHUB_ENV"
          if [ ! -d "$FLUTTER_ROOT/.git" ]; then
            git clone --branch 3.47.2 --depth 1 https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" --version --machine | jq -e '.frameworkVersion=="3.47.2"' >/dev/null
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 aarch64-linux-android
          # 复用官方运行机SDK，显式路径不依赖交互Shell的初始化。
          export ANDROID_HOME="$HOME/Library/Android/sdk"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          # App资源工具与其他官方工具在同一步准备，不增加功能构建步骤。
          version=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('assets/topup/package.json')).citizenapp.tools.esbuild)")
          npm install --prefix "$work/tools" --ignore-scripts --no-audit --no-fund "esbuild@$version"
          echo "ESBUILD_BIN=$work/tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
      - name: 按本产品原锁装配普通工程
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {assembleProject} from './scripts/build.mjs';
          await assembleProject(process.env);
          JS
      - name: 准备原生测试输入
        run: |
          set -euo pipefail
          cd "$WORK/project"
          flutter pub get --enforce-lockfile
          node --input-type=module <<'JS'
          import {readFileSync, copyFileSync, appendFileSync} from 'node:fs';
          import {fileURLToPath} from 'node:url';
          import {join} from 'node:path';
          const file = new URL('file://' + process.cwd() + '/.dart_tool/package_config.json');
          const entry = JSON.parse(readFileSync(file)).packages.find(row => row.name === 'isar_community_flutter_libs');
          if (!entry) throw Error('原锁缺少Isar');
          const library = process.env.WORK + '/libisar.dylib';
          // rootUri可不带尾斜线；先解析包根路径，避免URL拼接替换末级包目录。
          const packageRoot = fileURLToPath(new URL(entry.rootUri, file));
          copyFileSync(join(packageRoot, 'macos', 'libisar.dylib'), library);
          appendFileSync(process.env.GITHUB_ENV, 'ISAR_CORE_LIB_PATH=' + library + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'CITIZENAPP_TEST_WORK_DIR=' + process.env.WORK + '\n');
          JS
          git clone --filter=blob:none --sparse --depth=1 https://github.com/crcfrcn/citizenchain.git "$WORK/chain"
          git -C "$WORK/chain" sparse-checkout set runtime/primitives/tests/fixtures
          git -C "$WORK/chain" rev-parse HEAD > "$WORK/chain-source-sha"
          echo "CITIZENCHAIN_ROOT=$WORK/chain" >> "$GITHUB_ENV"
      - name: AI代码回归、严格分析及完整Flutter测试
        run: |
          set -euo pipefail
          node --test test/release_manifest.test.mjs test/transaction/topup/bridge.test.mjs
          cd "$WORK/project"
          flutter analyze --fatal-infos --fatal-warnings --no-pub
          flutter test --no-pub --concurrency=1 --fail-fast \
            --file-reporter "json:$WORK/flutter-report.jsonl"
          node --input-type=module <<'JS'
          import {readFileSync, readdirSync} from 'node:fs';
          const events = readFileSync(process.env.WORK + '/flutter-report.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          const starts = new Set(events.filter(row => row.type === 'testStart').map(row => row.test.id));
          const ended = events.filter(row => row.type === 'testDone');
          const done = events.filter(row => row.type === 'done');
          const walk = path => readdirSync(path, {withFileTypes: true}).flatMap(entry =>
              entry.isDirectory() ? walk(path + '/' + entry.name) : [path + '/' + entry.name]);
          const expected = walk(process.cwd() + '/test').filter(path => path.endsWith('_test.dart'));
          const loaded = events.filter(row => row.type === 'suite').map(row => row.suite.path);
          if (!starts.size || done.length !== 1 || done[0].success !== true || ended.length !== starts.size ||
              ended.some(row => row.skipped || row.result !== 'success') || expected.some(path => !loaded.includes(path))) {
              throw Error('Flutter全量回归失败、跳过或不完整');
          }
          JS
      - name: 准备本轮Android签名输入
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'JS'
          import {mkdirSync, writeFileSync, appendFileSync} from 'node:fs';
          const fields = {};
          for (const line of process.env.APP_KEY.split(/\r?\n/).map(value => value.trim()).filter(value => value && !value.startsWith('#'))) {
              const at = line.indexOf('='), key = line.slice(0, at), value = line.slice(at + 1);
              if (at < 1 || !value || Object.hasOwn(fields, key)) throw Error('APP_KEY字段无效');
              fields[key] = value;
          }
          if (Object.keys(fields).some(key => !['keystore', 'password', 'alias', 'keyPassword'].includes(key)) ||
              !fields.keystore || !fields.password || !/^[A-Za-z0-9._-]{1,128}$/.test(fields.alias || 'upload')) throw Error('APP_KEY内容无效');
          const bytes = Buffer.from(fields.keystore, 'base64');
          if (bytes.toString('base64') !== fields.keystore || bytes.length < 1024 || bytes.length > 32 * 1024 * 1024) throw Error('签名库格式无效');
          const directory = process.env.WORK + '/signing';
          mkdirSync(directory, {mode: 0o700});
          writeFileSync(directory + '/release.keystore', bytes, {mode: 0o600});
          const values = {
              CITIZENAPP_KEYSTORE: directory + '/release.keystore',
              CITIZENAPP_STORE_PASSWORD: fields.password,
              CITIZENAPP_KEY_ALIAS: fields.alias || 'upload',
              CITIZENAPP_KEY_PASSWORD: fields.keyPassword || fields.password
          };
          for (const [key, value] of Object.entries(values)) {
              console.log('::add-mask::' + value);
              appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          JS
      - name: 编译正式APK和AAB
        id: build
        run: node scripts/build.mjs android
      - name: 核对Android正式包
        run: |
          set -euo pipefail
          name="公民·Android·v$CITIZENAPP_VERSION"
          artifact="$WORK/artifact"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$artifact/$name.apk" > "$WORK/apk-certificate.txt"
          keytool -exportcert -keystore "$CITIZENAPP_KEYSTORE" -storepass:env CITIZENAPP_STORE_PASSWORD \
            -alias "$CITIZENAPP_KEY_ALIAS" -file "$WORK/expected.der"
          openssl x509 -inform DER -in "$WORK/expected.der" -noout -fingerprint -sha256 \
            | tr -d ':' | cut -d= -f2 | tr '[:upper:]' '[:lower:]' > "$WORK/expected-sha"
          grep -Fq "certificate SHA-256 digest: $(cat "$WORK/expected-sha")" "$WORK/apk-certificate.txt"
          jarsigner -verify "$artifact/$name.aab" > "$WORK/aab-verification.txt"
          grep -Fq 'jar verified.' "$WORK/aab-verification.txt"
          keytool -printcert -jarfile "$artifact/$name.aab" -rfc > "$WORK/aab.pem"
          openssl x509 -in "$WORK/aab.pem" -outform DER -out "$WORK/aab.der"
          cmp "$WORK/expected.der" "$WORK/aab.der"
          test "$(apkanalyzer manifest application-id "$artifact/$name.apk")" = com.crcfrcn.citizenapp
          test "$(apkanalyzer manifest version-name "$artifact/$name.apk")" = "$CITIZENAPP_VERSION"
          test "$(apkanalyzer manifest version-code "$artifact/$name.apk")" = "$GITHUB_RUN_NUMBER"
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const work = process.env.WORK, title = '公民·Android·v' + process.env.CITIZENAPP_VERSION;
          const sdk = await import(pathToFileURL(work + '/sources/tatachat_sdk/scripts/build.mjs'));
          for (const suffix of ['apk', 'aab']) {
              const file = work + '/artifact/' + title + '.' + suffix;
              const names = execFileSync('unzip', ['-Z1', file], {encoding: 'utf8'}).trim().split('\n');
              const prefix = suffix === 'apk' ? 'lib/' : 'base/lib/';
              if (names.some(name => name.startsWith(prefix) && !name.startsWith(prefix + 'arm64-v8a/'))) throw Error('正式包含其它ABI');
              for (const library of ['libcitizensdk.so', 'libcitizensdk_jni.so', 'libtatachat_sdk.so']) {
                  if (!names.includes(prefix + 'arm64-v8a/' + library)) throw Error('正式包缺少原生件');
              }
              const output = work + '/verify-' + suffix;
              mkdirSync(output);
              execFileSync('unzip', ['-q', file, prefix + 'arm64-v8a/libtatachat_sdk.so', '-d', output]);
              await sdk.verifyNative(output + '/' + prefix + 'arm64-v8a/libtatachat_sdk.so', 'android');
          }
          JS
      - name: 生成本轮正式附件说明
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, writeFileSync, readdirSync, statSync} from 'node:fs';
          const work = process.env.WORK, title = '公民·Android·v' + process.env.CITIZENAPP_VERSION;
          const directory = work + '/artifact';
          const digest = file => execFileSync('shasum', ['-a', '256', file], {encoding: 'utf8'}).split(' ')[0];
          const asset = name => ({name, size: statSync(directory + '/' + name).size, sha256: digest(directory + '/' + name)});
          const proof = {
              schema: 1, product_id: 'citizenapp', platform: process.env.PLATFORM,
              version: process.env.CITIZENAPP_VERSION, version_code: Number(process.env.GITHUB_RUN_NUMBER),
              source_sha: process.env.GITHUB_SHA, run_id: Number(process.env.GITHUB_RUN_ID),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              chain_test_sha: readFileSync(work + '/chain-source-sha', 'utf8').trim(),
              assets: readdirSync(directory).sort().map(asset)
          };
          const name = title + '.json';
          writeFileSync(directory + '/' + name, JSON.stringify(proof, null, 2) + '\n');
          proof.assets.push(asset(name));
          writeFileSync(work + '/proof.json', JSON.stringify(proof, null, 2) + '\n');
          JS
      - name: 公民·Android·v${{ needs.version.outputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民·Android·v${{ needs.version.outputs.version }}
          path: ${{ env.WORK }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="公民·Android·v$CITIZENAPP_VERSION"
          encoded="$(jq -nr --arg value "$name" '$value|@uri')"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$WORK/releases.json"
          old="$(jq -c --arg tag "$name" '[.[][]|select(.tag_name==$tag)]' "$WORK/releases.json")"
          test "$(jq 'length' <<< "$old")" -le 1
          if [ "$(jq 'length' <<< "$old")" = 1 ]; then
            proof="$(jq -r '.[0].body' <<< "$old")"
            jq -e --arg version "$CITIZENAPP_VERSION" '.product_id=="citizenapp" and .platform=="android" and .version==$version' <<< "$proof" >/dev/null
            previous_run="$(jq -r .run_id <<< "$proof")"
            previous_attempt="$(jq -r .run_attempt <<< "$proof")"
            previous_sha="$(jq -r .source_sha <<< "$proof")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/attempts/$previous_attempt" \
              | jq -e --arg sha "$previous_sha" '.status=="completed" and .conclusion!="success" and .head_sha==$sha and .path==".github/workflows/android.yml"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
              | jq -e --arg sha "$previous_sha" '.object.type=="commit" and .object.sha==$sha' >/dev/null
            gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # 未登记的同名Tag绝不覆盖。只有本轮新建对象可被失败回滚删除。
          export CITIZENAPP_RELEASE_NAME="$name"
          tag_created=false
          rollback() {
            code=$?
            if [ "$code" != 0 ]; then
              # gh创建成功但附件上传失败也可能留下草稿，按本Run证明准确查回。
              owned="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name==env.CITIZENAPP_RELEASE_NAME and .target_commitish==env.GITHUB_SHA)|select((.body|fromjson?|.run_id)==(env.GITHUB_RUN_ID|tonumber))|.id')" || echo '本次Release查询未完成' >&2
              if [[ "${owned:-}" =~ ^[1-9][0-9]*$ ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$owned" || echo '本次Release撤销未完成' >&2
              fi
              if [ "$tag_created" = true ]; then
                if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null; then
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded" || echo '本次Tag撤销未完成' >&2
                else
                  echo '本次Tag归属或撤销状态未确认' >&2
                fi
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$name" -f "sha=$GITHUB_SHA" > "$WORK/tag.json"
          tag_created=true
          assets=()
          for file in "$WORK/artifact/"*; do assets+=("$file#$(basename "$file")"); done
          gh release create "$name" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "$name" --notes-file "$WORK/proof.json" --draft
          gh release view "$name" --repo "$GITHUB_REPOSITORY" --json assets > "$WORK/assets.json"
          mkdir "$WORK/readback"
          for file in "$WORK/artifact/"*; do
            label="$(basename "$file")"
            remote="$(jq -er --arg label "$label" '[.assets[]|select(.label==$label)]|if length==1 then .[0].name else error("附件标签不唯一") end' "$WORK/assets.json")"
            gh release download "$name" --repo "$GITHUB_REPOSITORY" --pattern "$remote" --output "$WORK/readback/$label"
            cmp "$file" "$WORK/readback/$label"
          done
          gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" --arg tag "$name" '.draft==false and .prerelease==false and .published_at!=null and .name==$tag and .tag_name==$tag and .target_commitish==$sha and (.assets|length)==3' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          trap - EXIT
      # Google官方认证仅生成短期令牌，不写凭据文件，不进入正式附件。
      - name: 取得Google Play上传授权
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.PLAY_SERVICEACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: 上传正式AAB到Google Play草稿并回查
        timeout-minutes: 15
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const token = process.env.GOOGLE_PLAY_ACCESS_TOKEN;
          if (!token) throw Error('缺少Google Play上传授权');
          const base = 'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.crcfrcn.citizenapp/edits';
          const request = async (url, method = 'GET', body, type = 'application/json') => {
            const response = await fetch(url, {method, redirect: 'error',
              headers: {Authorization: 'Bearer ' + token, 'Content-Type': type},
              body: body === undefined ? undefined : type === 'application/json' ? JSON.stringify(body) : body,
              signal: AbortSignal.timeout(600000)});
            if (!response.ok) {
              // 只保留Google错误说明，不输出请求头、正文或访问令牌。
              const data = await response.json().catch(() => null);
              const reasons = Array.isArray(data?.error?.errors) ? data.error.errors.map(item => item?.reason) : [];
              const detail = [data?.error?.status, data?.error?.message, ...reasons]
                .filter(value => typeof value === 'string' && value).join('；').replaceAll(token, '[已隐藏]');
              throw Error('Google Play请求失败：' + method + ' HTTP ' + response.status + '；' +
                (detail || 'Google未返回JSON错误说明'));
            }
            return response.status === 204 ? null : response.json();
          };
          const name = '公民·Android·v' + process.env.CITIZENAPP_VERSION;
          const code = String(process.env.GITHUB_RUN_NUMBER);
          let edit;
          try {
            edit = (await request(base, 'POST', {})).id;
            const url = base + '/' + edit;
            const bundle = await request(url.replace('/androidpublisher/v3/', '/upload/androidpublisher/v3/') + '/bundles?uploadType=media',
              'POST', await readFile(process.env.WORK + '/artifact/' + name + '.aab'), 'application/octet-stream');
            if (String(bundle.versionCode) !== code) throw Error('Google Play返回版本号不一致');
            const track = await request(url + '/tracks/internal');
            // 只替换内部轨道旧草稿，保留已分发版本，不触发分发、审核或上架。
            track.releases = [...(track.releases ?? []).filter(row => row.status !== 'draft'),
              {name, versionCodes: [code], status: 'draft'}];
            await request(url + '/tracks/internal', 'PUT', track);
            await request(url + ':commit', 'POST', {});
            edit = undefined;
            // 新edit回读已保存草稿，观察edit随后删除，不产生正式发布。
            edit = (await request(base, 'POST', {})).id;
            const saved = await request(base + '/' + edit + '/tracks/internal');
            if (!saved.releases?.some(row => row.name === name && row.status === 'draft' &&
                row.versionCodes?.includes(code))) throw Error('Google Play草稿回查失败');
            console.log(name + ' 已上传Google Play，草稿回查通过，未上架');
          } finally {
            if (edit) await request(base + '/' + edit, 'DELETE');
          }
          NODE
      - name: 保存官方增量缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮普通现场和签名输入
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${WORK:-}" ]; then exit 0; fi
          test "$WORK" = "$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          if (work / 'build-active.json').exists():
              raise RuntimeError('编译进程退出未确认，保留现场')
          if (directory / 'keychains').exists():
              original = shlex.split((directory / 'keychains').read_text())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *original], check=True)
          if (directory / 'release.keychain-db').exists():
              subprocess.run(['security', 'delete-keychain', str(directory / 'release.keychain-db')], check=True)
          if (directory / 'installed-profile').exists():
              pathlib.Path((directory / 'installed-profile').read_text()).unlink(missing_ok=True)
          shutil.rmtree(work)
          PY
  cleanup:
    name: 公民·Android·收尾
    needs: [version, compile]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: 清理本平台旧记录并回查
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: android
          RESULT: ${{ needs.version.result == 'success' && needs.compile.result == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          base="repos/$GITHUB_REPOSITORY"
          label=$([ "$PLATFORM" = ios ] && echo iOS || echo Android)
          prefix="公民·${label}·v"
          # 仅真实404表示不存在；失败不重试，也不把权限或网络错误当作清理成功。
          gone() {
            local response
            if response="$(gh api --method GET --include --silent "$base/$1" 2>&1)"; then return 1; fi
            [[ "$response" =~ HTTP/[0-9.]+[[:space:]]404 ]]
          }
          pages() { gh api --paginate --slurp "$base/$1" | jq -c "map($2) | add // []"; }
          runs="$(pages "actions/workflows/$PLATFORM.yml/runs?branch=main&per_page=100" .workflow_runs)"
          # 当前Run按编译结果选择保留组；活动Run始终保留，真实终态仍由GitHub确认。
          keep="$(jq -c --argjson current "$GITHUB_RUN_ID" --arg result "$RESULT" '
            [.[] | select(.status == "completed" or .id == $current) |
              {id, order:.run_number, result:(if .id == $current then $result elif .conclusion == "success" then "success" else "failure" end)}] |
            group_by(.result) | map(max_by([.order,.id]).id)' <<<"$runs")"
          keep="$(jq -c --argjson keep "$keep" --argjson current "$GITHUB_RUN_ID" '
            $keep + [$current] + [.[] | select(.status != "completed") | .id] | unique' <<<"$runs")"
          releases="$(pages 'releases?per_page=100' .)"
          while IFS= read -r release; do
            proof="$(jq -ce --arg platform "$PLATFORM" --arg prefix "$prefix" '
              . as $release | (.body | fromjson) |
              select(.product_id == "citizenapp" and .platform == $platform and
                (.run_id | type == "number" and . > 0 and . == floor) and
                (.run_attempt | type == "number" and . > 0 and . == floor) and
                (.source_sha | test("^[a-f0-9]{40}$")) and
                (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) and
                $release.tag_name == ($prefix + .version) and $release.target_commitish == .source_sha)' <<<"$release")"
            owner="$(jq -r .run_id <<<"$proof")"
            old="$(jq -c --argjson owner "$owner" '.[] | select(.id == $owner)' <<<"$runs")"
            if [ -n "$old" ]; then
              jq -e --argjson proof "$proof" '.head_sha == $proof.source_sha and .run_attempt >= $proof.run_attempt' <<<"$old" >/dev/null
            else
              gone "actions/runs/$owner"
            fi
            if jq -e --argjson owner "$owner" 'index($owner) != null' <<<"$keep" >/dev/null; then continue; fi
            tag="$(jq -r .tag_name <<<"$release")"
            encoded="$(jq -nr --arg tag "$tag" '$tag | @uri')"
            if ref="$(gh api "$base/git/ref/tags/$encoded" 2>/dev/null)"; then
              jq -e --argjson proof "$proof" '.object.type == "commit" and .object.sha == $proof.source_sha' <<<"$ref" >/dev/null
              gh api --method DELETE "$base/git/refs/tags/$encoded"
              gone "git/ref/tags/$encoded"
            else
              gone "git/ref/tags/$encoded"
            fi
            id="$(jq -r .id <<<"$release")"
            gh api --method DELETE "$base/releases/$id"
            gone "releases/$id"
          done < <(jq -c --arg prefix "$prefix" '.[] | select(.tag_name | startswith($prefix))' <<<"$releases")
          # 缓存只处理本平台、main和准确Run后缀；旧Run删除同时移除其日志与Artifact。
          caches="$(pages 'actions/caches?per_page=100' .actions_caches)"
          stale="$(jq -c --arg prefix "citizenapp-$PLATFORM-" --argjson keep "$keep" '
            [.[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix))) |
              (.key | capture("-(?<run>[1-9][0-9]*)-[1-9][0-9]*$").run | tonumber) as $owner |
              select($keep | index($owner) | not) | .id]' <<<"$caches")"
          while IFS= read -r id; do gh api --method DELETE "$base/actions/caches/$id"; done < <(jq -r '.[]' <<<"$stale")
          pages 'actions/caches?per_page=100' .actions_caches |
            jq -e --argjson stale "$stale" 'all(.[]; .id as $id | $stale | index($id) == null)' >/dev/null
          obsolete="$(jq -c --argjson keep "$keep" '[.[] | select(.status == "completed") | .id | select(. as $id | $keep | index($id) | not)]' <<<"$runs")"
          while IFS= read -r id; do
            gh run delete "$id" --repo "$GITHUB_REPOSITORY"
            gone "actions/runs/$id"
            gone "actions/runs/$id/logs"
          done < <(jq -r '.[]' <<<"$obsolete")
          pages 'actions/artifacts?per_page=100' .artifacts |
            jq -e --argjson obsolete "$obsolete" 'all(.[]; .workflow_run.id as $id | $obsolete | index($id) == null)' >/dev/null
          # 无回执的孤立Tag不从Run显示名猜归属，保留并报告真实失败。
          remaining="$(pages 'releases?per_page=100' .)"
          protected="$(jq -c --arg prefix "$prefix" --argjson keep "$keep" '
            [.[] | select(.tag_name | startswith($prefix)) |
              (.body | fromjson | .run_id) as $owner |
              if ($keep | index($owner)) != null then .tag_name else error("仍有未清理的Release") end]' <<<"$remaining")"
          encoded="$(jq -nr --arg prefix "$prefix" '$prefix | @uri')"
          pages "git/matching-refs/tags/$encoded?per_page=100" . |
            jq -e --argjson protected "$protected" 'all(.[]; (.ref | ltrimstr("refs/tags/")) as $tag | $protected | index($tag) != null)' >/dev/null
          printf '本平台历史清理完成，保留Run：%s\n' "$keep"
