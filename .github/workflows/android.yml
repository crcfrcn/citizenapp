              {
                "filename": "CitizenLaunchLogo.png",
                "idiom": "universal",
                "scale": "1x"
              },
              {
                "filename": "CitizenLaunchLogo@2x.png",
                "idiom": "universal",
                "scale": "2x"
              },
              {
                "filename": "CitizenLaunchLogo@3x.png",
                "idiom": "universal",
                "scale": "3x"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          `);
          for (const [density, icon, foreground, launch] of [['mdpi',48,108,120], ['hdpi',72,162,180], ['xhdpi',96,216,240], ['xxhdpi',144,324,360], ['xxxhdpi',192,432,480]]) {
              const destination = 'android/app/src/main/res/mipmap-' + density + '/';
              for (const name of ['ic_launcher', 'ic_launcher_round']) copy('assets/logo/icon' + icon + '.png', destination + name + '.png');
              copy('assets/logo/foreground' + foreground + '.png', destination + 'ic_launcher_foreground.png');
              copy('assets/logo/launch' + launch + '.png', destination + 'launch_image.png');
          }
          write('android/app/src/main/res/drawable-v21/launch_background.xml', readFileSync(join(project, 'android/app/src/main/res/drawable/launch_background.xml'), 'utf8'));
          const iconSet = 'ios/Runner/Assets.xcassets/AppIcon.appiconset/';
          const icons = JSON.parse(readFileSync(join(project, iconSet, 'Contents.json')));
          for (const image of icons.images) {
              if (!image.filename) continue;
              const size = Number(image.size.split('x')[0]) * Number(image.scale.replace('x', ''));
              copy('assets/logo/icon' + size + '.png', iconSet + image.filename);
          }
          for (const [scale, suffix] of [[1,''], [2,'@2x'], [3,'@3x']]) copy('assets/logo/launch' + 160 * scale + '.png', 'ios/Runner/Assets.xcassets/CitizenLaunchLogo.imageset/CitizenLaunchLogo' + suffix + '.png');
          writeFileSync(join(project, 'analysis_options.yaml'), 'include: package:flutter_lints/flutter.yaml\nanalyzer:\n  exclude:\n    - build/**\n    - android/**\n    - ios/**\n');
          chmodSync(join(project, 'android/gradlew'), 0o755);
          const citizen = join(work, 'sources/citizen_sdk/scripts/build.mjs');
          const source = join(work, 'citizen-sources');
          execFileSync(process.execPath, [citizen, 'prepare-environment', '--platform', 'macOS', '--work', source], {stdio: 'inherit'});
          const plan = JSON.parse(execFileSync(process.execPath, [citizen, 'plan', '--platform', 'macOS'], {encoding: 'utf8'}));
          const qr = plan.archives.filter(entry => /zxing/i.test(entry.name));
          if (qr.length !== 1) throw Error('SDK公开QR来源不唯一');
          const values = {
              CITIZENSDK_WORK_DIR: join(work, 'native-work'),
              CITIZENSDK_NATIVE_OUTPUT_DIR: join(work, 'native'),
              CITIZENSDK_ZXING_SOURCE_DIR: join(source, qr[0].archive_root),
              CITIZENSDK_GRADLE: join(project, 'android/gradlew'),
              CITIZENSDK_ANDROID_CORE_DIR: join(work, 'native/android/arm64-v8a'),
              CITIZENSDK_ANDROID_BUILD_DIR: join(work, 'citizen-android'),
              CITIZENSDK_TEST_CORE_LIB_PATH: join(work, 'native/abi-host/libcitizensdk.dylib'),
              TATACHATSDK_TEST_WORK_ROOT: work,
              TATACHATSDK_TEST_NATIVE_LIBRARY: join(work, 'packages/tatachat_sdk/native/libtatachat_sdk.dylib')
          };
          for (const [key, value] of Object.entries(values)) appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          JS
      - name: 编译本轮原生依赖
        run: node scripts/build.mjs android dependencies
      - name: 准备原生测试输入
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = ios ]; then
            cp -R "$WORK/native/apple/CitizenSDK.xcframework" "$WORK/packages/citizen_sdk/darwin/"
          fi
          cd "$WORK/project"
          flutter pub get --enforce-lockfile
          node --input-type=module <<'JS'
          import {readFileSync, copyFileSync, appendFileSync} from 'node:fs';
          import {fileURLToPath} from 'node:url';
          import {join} from 'node:path';
          const file = new URL('file://' + process.cwd() + '/.dart_tool/package_config.json');
          const entry = JSON.parse(readFileSync(file)).packages.find(row => row.name === 'isar_community_flutter_libs');
          if (!entry) throw Error('原锁缺少Isar');
          const library = process.env.WORK + '/libisar.dylib';
          // rootUri可不带尾斜线；先解析包根路径，避免URL拼接替换末级包目录。
          const packageRoot = fileURLToPath(new URL(entry.rootUri, file));
          copyFileSync(join(packageRoot, 'macos', 'libisar.dylib'), library);
          appendFileSync(process.env.GITHUB_ENV, 'ISAR_CORE_LIB_PATH=' + library + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'CITIZENAPP_TEST_WORK_DIR=' + process.env.WORK + '\n');
          JS
          git clone --filter=blob:none --sparse --depth=1 https://github.com/crcfrcn/citizenchain.git "$WORK/chain"
          git -C "$WORK/chain" sparse-checkout set runtime/primitives/tests/fixtures
          git -C "$WORK/chain" rev-parse HEAD > "$WORK/chain-source-sha"
          echo "CITIZENCHAIN_ROOT=$WORK/chain" >> "$GITHUB_ENV"
      - name: AI代码回归、严格分析及完整Flutter测试
        run: |
          set -euo pipefail
          node --test test/release_manifest.test.mjs
          cd "$WORK/project"
          flutter analyze --fatal-infos --fatal-warnings --no-pub
          flutter test --no-pub --concurrency=1 --fail-fast \
            --file-reporter "json:$WORK/flutter-report.jsonl"
          node --input-type=module <<'JS'
          import {readFileSync, readdirSync} from 'node:fs';
          const events = readFileSync(process.env.WORK + '/flutter-report.jsonl', 'utf8').trim().split('\n').map(JSON.parse);
          const starts = new Set(events.filter(row => row.type === 'testStart').map(row => row.test.id));
          const ended = events.filter(row => row.type === 'testDone');
          const done = events.filter(row => row.type === 'done');
          const walk = path => readdirSync(path, {withFileTypes: true}).flatMap(entry =>
              entry.isDirectory() ? walk(path + '/' + entry.name) : [path + '/' + entry.name]);
          const expected = walk(process.cwd() + '/test').filter(path => path.endsWith('_test.dart'));
          const loaded = events.filter(row => row.type === 'suite').map(row => row.suite.path);
          if (!starts.size || done.length !== 1 || done[0].success !== true || ended.length !== starts.size ||
              ended.some(row => row.skipped || row.result !== 'success') || expected.some(path => !loaded.includes(path))) {
              throw Error('Flutter全量回归失败、跳过或不完整');
          }
          JS
      - name: 准备本轮Android签名输入
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'JS'
          import {mkdirSync, writeFileSync, appendFileSync} from 'node:fs';
          const fields = {};
          for (const line of process.env.APP_KEY.split(/\r?\n/).map(value => value.trim()).filter(value => value && !value.startsWith('#'))) {
              const at = line.indexOf('='), key = line.slice(0, at), value = line.slice(at + 1);
              if (at < 1 || !value || Object.hasOwn(fields, key)) throw Error('APP_KEY字段无效');
              fields[key] = value;
          }
          if (Object.keys(fields).some(key => !['keystore', 'password', 'alias', 'keyPassword'].includes(key)) ||
              !fields.keystore || !fields.password || !/^[A-Za-z0-9._-]{1,128}$/.test(fields.alias || 'upload')) throw Error('APP_KEY内容无效');
          const bytes = Buffer.from(fields.keystore, 'base64');
          if (bytes.toString('base64') !== fields.keystore || bytes.length < 1024 || bytes.length > 32 * 1024 * 1024) throw Error('签名库格式无效');
          const directory = process.env.WORK + '/signing';
          mkdirSync(directory, {mode: 0o700});
          writeFileSync(directory + '/release.keystore', bytes, {mode: 0o600});
          const values = {
              CITIZENAPP_KEYSTORE: directory + '/release.keystore',
              CITIZENAPP_STORE_PASSWORD: fields.password,
              CITIZENAPP_KEY_ALIAS: fields.alias || 'upload',
              CITIZENAPP_KEY_PASSWORD: fields.keyPassword || fields.password
          };
          for (const [key, value] of Object.entries(values)) {
              console.log('::add-mask::' + value);
              appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          JS
      - name: 编译正式APK和AAB
        id: build
        run: node scripts/build.mjs android
      - name: 核对Android正式包
        run: |
          set -euo pipefail
          name="公民·Android·v$CITIZENAPP_VERSION"
          artifact="$WORK/artifact"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$artifact/$name.apk" > "$WORK/apk-certificate.txt"
          keytool -exportcert -keystore "$CITIZENAPP_KEYSTORE" -storepass:env CITIZENAPP_STORE_PASSWORD \
            -alias "$CITIZENAPP_KEY_ALIAS" -file "$WORK/expected.der"
          openssl x509 -inform DER -in "$WORK/expected.der" -noout -fingerprint -sha256 \
            | tr -d ':' | cut -d= -f2 | tr '[:upper:]' '[:lower:]' > "$WORK/expected-sha"
          grep -Fq "certificate SHA-256 digest: $(cat "$WORK/expected-sha")" "$WORK/apk-certificate.txt"
          jarsigner -verify "$artifact/$name.aab" > "$WORK/aab-verification.txt"
          grep -Fq 'jar verified.' "$WORK/aab-verification.txt"
          keytool -printcert -jarfile "$artifact/$name.aab" -rfc > "$WORK/aab.pem"
          openssl x509 -in "$WORK/aab.pem" -outform DER -out "$WORK/aab.der"
          cmp "$WORK/expected.der" "$WORK/aab.der"
          test "$(apkanalyzer manifest application-id "$artifact/$name.apk")" = com.crcfrcn.citizenapp
          test "$(apkanalyzer manifest version-name "$artifact/$name.apk")" = "$CITIZENAPP_VERSION"
          test "$(apkanalyzer manifest version-code "$artifact/$name.apk")" = "$GITHUB_RUN_NUMBER"
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const work = process.env.WORK, title = '公民·Android·v' + process.env.CITIZENAPP_VERSION;
          const sdk = await import(pathToFileURL(work + '/sources/tatachat_sdk/scripts/build.mjs'));
          for (const suffix of ['apk', 'aab']) {
              const file = work + '/artifact/' + title + '.' + suffix;
              const names = execFileSync('unzip', ['-Z1', file], {encoding: 'utf8'}).trim().split('\n');
              const prefix = suffix === 'apk' ? 'lib/' : 'base/lib/';
              if (names.some(name => name.startsWith(prefix) && !name.startsWith(prefix + 'arm64-v8a/'))) throw Error('正式包含其它ABI');
              for (const library of ['libcitizensdk.so', 'libcitizensdk_jni.so', 'libtatachat_sdk.so']) {
                  if (!names.includes(prefix + 'arm64-v8a/' + library)) throw Error('正式包缺少原生件');
              }
              const output = work + '/verify-' + suffix;
              mkdirSync(output);
              execFileSync('unzip', ['-q', file, prefix + 'arm64-v8a/libtatachat_sdk.so', '-d', output]);
              await sdk.verifyNative(output + '/' + prefix + 'arm64-v8a/libtatachat_sdk.so', 'android');
          }
          JS
      - name: 生成本轮正式附件说明
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {readFileSync, writeFileSync, readdirSync, statSync} from 'node:fs';
          const work = process.env.WORK, title = '公民·Android·v' + process.env.CITIZENAPP_VERSION;
          const directory = work + '/artifact';
          const digest = file => execFileSync('shasum', ['-a', '256', file], {encoding: 'utf8'}).split(' ')[0];
          const asset = name => ({name, size: statSync(directory + '/' + name).size, sha256: digest(directory + '/' + name)});
          const proof = {
              schema: 1, product_id: 'citizenapp', platform: process.env.PLATFORM,
              version: process.env.CITIZENAPP_VERSION, version_code: Number(process.env.GITHUB_RUN_NUMBER),
              source_sha: process.env.GITHUB_SHA, run_id: Number(process.env.GITHUB_RUN_ID),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              chain_test_sha: readFileSync(work + '/chain-source-sha', 'utf8').trim(),
              assets: readdirSync(directory).sort().map(asset)
          };
          const name = title + '.json';
          writeFileSync(directory + '/' + name, JSON.stringify(proof, null, 2) + '\n');
          proof.assets.push(asset(name));
          writeFileSync(work + '/proof.json', JSON.stringify(proof, null, 2) + '\n');
          JS
      - name: 公民·Android·v${{ inputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民·Android·v${{ inputs.version }}
          path: ${{ env.WORK }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="公民·Android·v$CITIZENAPP_VERSION"
          encoded="$(jq -nr --arg value "$name" '$value|@uri')"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$WORK/releases.json"
          old="$(jq -c --arg tag "$name" '[.[][]|select(.tag_name==$tag)]' "$WORK/releases.json")"
          test "$(jq 'length' <<< "$old")" -le 1
          if [ "$(jq 'length' <<< "$old")" = 1 ]; then
            proof="$(jq -r '.[0].body' <<< "$old")"
            jq -e --arg version "$CITIZENAPP_VERSION" '.product_id=="citizenapp" and .platform=="android" and .version==$version' <<< "$proof" >/dev/null
            previous_run="$(jq -r .run_id <<< "$proof")"
            previous_attempt="$(jq -r .run_attempt <<< "$proof")"
            previous_sha="$(jq -r .source_sha <<< "$proof")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/attempts/$previous_attempt" \
              | jq -e --arg sha "$previous_sha" '.status=="completed" and .conclusion!="success" and .head_sha==$sha and .path==".github/workflows/android.yml"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
              | jq -e --arg sha "$previous_sha" '.object.type=="commit" and .object.sha==$sha' >/dev/null
            gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          # 未登记的同名Tag绝不覆盖。只有本轮新建对象可被失败回滚删除。
          export CITIZENAPP_RELEASE_NAME="$name"
          tag_created=false
          rollback() {
            code=$?
            if [ "$code" != 0 ]; then
              # gh创建成功但附件上传失败也可能留下草稿，按本Run证明准确查回。
              owned="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name==env.CITIZENAPP_RELEASE_NAME and .target_commitish==env.GITHUB_SHA)|select((.body|fromjson?|.run_id)==(env.GITHUB_RUN_ID|tonumber))|.id')" || echo '本次Release查询未完成' >&2
              if [[ "${owned:-}" =~ ^[1-9][0-9]*$ ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$owned" || echo '本次Release撤销未完成' >&2
              fi
              if [ "$tag_created" = true ]; then
                if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null; then
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded" || echo '本次Tag撤销未完成' >&2
                else
                  echo '本次Tag归属或撤销状态未确认' >&2
                fi
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$name" -f "sha=$GITHUB_SHA" > "$WORK/tag.json"
          tag_created=true
          assets=()
          for file in "$WORK/artifact/"*; do assets+=("$file#$(basename "$file")"); done
          gh release create "$name" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --target "$GITHUB_SHA" --title "$name" --notes-file "$WORK/proof.json" --draft
          gh release view "$name" --repo "$GITHUB_REPOSITORY" --json assets > "$WORK/assets.json"
          mkdir "$WORK/readback"
          for file in "$WORK/artifact/"*; do
            label="$(basename "$file")"
            remote="$(jq -er --arg label "$label" '[.assets[]|select(.label==$label)]|if length==1 then .[0].name else error("附件标签不唯一") end' "$WORK/assets.json")"
            gh release download "$name" --repo "$GITHUB_REPOSITORY" --pattern "$remote" --output "$WORK/readback/$label"
            cmp "$file" "$WORK/readback/$label"
          done
          gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" --arg tag "$name" '.draft==false and .prerelease==false and .published_at!=null and .name==$tag and .tag_name==$tag and .target_commitish==$sha and (.assets|length)==3' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" \
            | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          trap - EXIT
      - name: 保存官方增量缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache/flutter
            target/cache/pub
            target/cache/rust
            target/cache/gradle/caches/modules-2
            target/cache/gradle/wrapper
          key: citizenapp-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock', 'android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮普通现场和签名输入
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${WORK:-}" ]; then exit 0; fi
          test "$WORK" = "$GITHUB_WORKSPACE/target/build/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess, shutil
          work = pathlib.Path(os.environ['WORK'])
          directory = work / 'signing'
          if (work / 'build-active.json').exists():
              raise RuntimeError('编译进程退出未确认，保留现场')
          if (directory / 'keychains').exists():
              original = shlex.split((directory / 'keychains').read_text())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *original], check=True)
          if (directory / 'release.keychain-db').exists():
              subprocess.run(['security', 'delete-keychain', str(directory / 'release.keychain-db')], check=True)
          if (directory / 'installed-profile').exists():
              pathlib.Path((directory / 'installed-profile').read_text()).unlink(missing_ok=True)
          shutil.rmtree(work)
          PY
      # 不新增Job或Run；只清本仓本平台已结束的历史，失败不取消另一端。
      - name: 删除本平台旧记录及附属数据并回查
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CITIZENAPP_CLEANUP_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = crcfrcn/citizenapp
          test "$GITHUB_REF" = refs/heads/main
          case "$PLATFORM" in ios) label=iOS ;; android) label=Android ;; *) exit 1 ;; esac
          case "$CITIZENAPP_CLEANUP_RESULT" in
            success) outcome=success ;;
            failure|cancelled) outcome=failed ;;
            *) echo '此前Job结果未确认，禁止清理' >&2; exit 1 ;;
          esac
          base="repos/$GITHUB_REPOSITORY"
          workflow=".github/workflows/$PLATFORM.yml"
          prefix="citizenapp-$PLATFORM-"

          # 只将真实404视为不存在；权限、网络和服务错误不能冒充删除成功。
          absent() {
            local response
            if response="$(gh api --method GET --include --silent "$base/$1" 2>&1)"; then
              echo "对象仍存在：$1" >&2; return 1
            fi
            if [[ ! "$response" =~ HTTP/[0-9.]+[[:space:]]404 ]]; then
              echo "对象删除状态未确认：$1" >&2; return 1
            fi
          }
          optional() {
            local value
            if value="$(gh api --method GET "$base/$1" 2>/dev/null)"; then
              printf '%s\n' "$value"
            else
              absent "$1" || return 1
              printf 'null\n'
            fi
          }
          remove() {
            if ! gh api --method DELETE "$base/$1"; then absent "$2" || return 1; fi
            absent "$2"
          }
          pages() {
            gh api --method GET --paginate --slurp "$base/$1?per_page=100" |
              jq -ce --arg field "$2" 'map(if $field == "" then . else .[$field] end) |
                if all(.[]; type == "array") then add // [] else error("分页响应不是数组") end'
          }
          read_runs() {
            pages "actions/workflows/$PLATFORM.yml/runs" workflow_runs |
              jq -c --arg repo "$GITHUB_REPOSITORY" --arg path "$workflow" \
                '[.[] | select(.repository.full_name == $repo and .path == $path and .head_branch == "main")]'
          }
          remove_cache() {
            if ! gh api --method DELETE "$base/actions/caches/$1"; then
              pages actions/caches actions_caches | jq -e --argjson id "$1" 'all(.[]; .id != $id)' >/dev/null || return 1
            fi
            pages actions/caches actions_caches | jq -e --argjson id "$1" 'all(.[]; .id != $id)' >/dev/null
          }
          remove_release() {
            local release="$1" id="$2" sha="$3" name="$4" attempt="$5"
            local tag encoded ref release_id
            tag="$(jq -r .tag_name <<<"$release")"
            if jq -e --arg tag "$tag" 'index($tag) != null' <<<"$protected" >/dev/null; then return; fi
            jq -e --arg platform "$PLATFORM" --arg sha "$sha" --arg name "$name" \
              --argjson id "$id" --argjson attempt "$attempt" '
              (.body | fromjson) as $proof | $proof.product_id == "citizenapp" and
              $proof.platform == $platform and $proof.run_id == $id and $proof.source_sha == $sha and
              ($proof.run_attempt | type) == "number" and $proof.run_attempt > 0 and
              $proof.run_attempt <= $attempt and .tag_name == $name and .target_commitish == $sha' <<<"$release" >/dev/null
            encoded="$(jq -nr --arg tag "$tag" '$tag | @uri')"
            ref="$(optional "git/ref/tags/$encoded")"
            if [ "$ref" != null ]; then
              jq -e --arg sha "$sha" '.object.type == "commit" and .object.sha == $sha' <<<"$ref" >/dev/null
              remove "git/refs/tags/$encoded" "git/ref/tags/$encoded"
            fi
            release_id="$(jq -r .id <<<"$release")"
            remove "releases/$release_id" "releases/$release_id"
          }
          current="$(gh api --method GET "$base/actions/runs/$GITHUB_RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg path "$workflow" --arg sha "$GITHUB_SHA" \
            --argjson id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '.id == $id and .run_attempt == $attempt and .head_sha == $sha and
             .repository.full_name == $repo and .path == $path and .head_branch == "main"' <<<"$current" >/dev/null
          runs="$(read_runs)"
          runs="$(jq -c --argjson current "$current" \
            'if any(.[]; .id == $current.id) then . else . + [$current] end' <<<"$runs")"
          jq -e --argjson id "$GITHUB_RUN_ID" \
            'all(.[]; .status != "completed" or .id <= $id)' <<<"$runs" >/dev/null

          # 当前Run尚未终态，只单独计算候选类别，不改写GitHub返回的状态。
          keep="$(jq -c --argjson id "$GITHUB_RUN_ID" --arg outcome "$outcome" '
            [.[] | select(.status == "completed" or .id == $id) |
              {id, order: .run_number, result: (if .id == $id then $outcome
                elif .conclusion == "success" then "success" else "failed" end)}] |
            group_by(.result) | map(max_by([.order, .id]).id)' <<<"$runs")"
          active="$(jq -c '[.[] | select(.status != "completed") | .id]' <<<"$runs")"
          keep="$(jq -cn --argjson keep "$keep" --argjson active "$active" --argjson id "$GITHUB_RUN_ID" \
            '$keep + $active + [$id] | unique')"
          protected="$(jq -c --argjson keep "$keep" \
            '[.[] | .id as $id | select($keep | index($id)) | .display_title] | unique' <<<"$runs")"
          obsolete="$(jq -c --argjson keep "$keep" \
            '[.[] | .id as $id | select(.status == "completed" and ($keep | index($id) | not))] |
             sort_by([.conclusion == "success", .run_number, .id])' <<<"$runs")"

          # 已删除Run的正式对象只能凭本产品原回执及真实404认领，不按模糊名称删除。
          releases="$(pages releases '')"
          while IFS= read -r release; do
            owner="$(jq -er '.body | fromjson | .run_id | select(type == "number" and . > 0 and . == floor)' <<<"$release")"
            if jq -e --argjson owner "$owner" 'any(.[]; .id == $owner)' <<<"$runs" >/dev/null; then continue; fi
            absent "actions/runs/$owner"
            proof="$(jq -er '.body | fromjson' <<<"$release")"
            sha="$(jq -er '.source_sha | select(test("^[a-f0-9]{40}$"))' <<<"$proof")"
            name="$(jq -er --arg label "$label" '"公民·" + $label + "·v" + .version' <<<"$proof")"
            remove_release "$release" "$owner" "$sha" "$name" "$(jq -er .run_attempt <<<"$proof")"
          done < <(jq -c --arg platform "$PLATFORM" '.[] |
            select((.body | fromjson?) as $proof | $proof.product_id == "citizenapp" and $proof.platform == $platform)' <<<"$releases")

          # 缓存独立于Run存在；先清真实404旧Run留下的本平台孤立缓存。
          caches="$(pages actions/caches actions_caches)"
          jq -e --arg prefix "$prefix" 'all(.[] |
            select(.ref == "refs/heads/main" and (.key | startswith($prefix)));
            (.id | type) == "number" and (.key | test("-[1-9][0-9]*-[1-9][0-9]*$")))' <<<"$caches" >/dev/null
          while IFS= read -r cache; do
            owner="$(jq -er '.key | capture("-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$") | .run | tonumber' <<<"$cache")"
            if jq -e --argjson owner "$owner" 'any(.[]; .id == $owner)' <<<"$runs" >/dev/null; then continue; fi
            absent "actions/runs/$owner"
            cache_id="$(jq -r .id <<<"$cache")"
            remove_cache "$cache_id"
          done < <(jq -c --arg prefix "$prefix" \
            '.[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix)))' <<<"$caches")

          # 失败旧记录先清，旧成功记录及其附件最后清；保留共享版本的正式对象。
          while IFS= read -r old; do
            id="$(jq -r .id <<<"$old")"
            sha="$(jq -r .head_sha <<<"$old")"
            name="$(jq -r .display_title <<<"$old")"
            fresh="$(gh api --method GET "$base/actions/runs/$id")"
            jq -e --argjson old "$old" --arg path "$workflow" \
              '.status == "completed" and .path == $path and .head_branch == "main" and
               .id == $old.id and .run_attempt == $old.run_attempt and .head_sha == $old.head_sha' <<<"$fresh" >/dev/null
            releases="$(pages releases '')"
            while IFS= read -r release; do
              remove_release "$release" "$id" "$sha" "$name" "$(jq -r .run_attempt <<<"$old")"
            done < <(jq -c --argjson id "$id" '.[] | select((.body | fromjson? | .run_id) == $id)' <<<"$releases")
            if ! jq -e --arg name "$name" 'index($name) != null' <<<"$protected" >/dev/null; then
              # 无Release的孤立Tag只按本平台准确Run名称和提交归属删除。
              case "$name" in "公民·${label}·v"*) ;; *) echo '旧Run名称无法确认Tag归属' >&2; exit 1 ;; esac
              encoded="$(jq -nr --arg tag "$name" '$tag | @uri')"
              attached="$(optional "releases/tags/$encoded")"
              if [ "$attached" != null ]; then
                echo '旧Tag仍有归属未确认的Release，禁止删除' >&2; exit 1
              fi
              ref="$(optional "git/ref/tags/$encoded")"
              if [ "$ref" != null ]; then
                jq -e --arg sha "$sha" '.object.type == "commit" and .object.sha == $sha' <<<"$ref" >/dev/null
                remove "git/refs/tags/$encoded" "git/ref/tags/$encoded"
              fi
            fi
            artifacts="$(pages "actions/runs/$id/artifacts" artifacts)"
            while IFS= read -r artifact_id; do
              remove "actions/artifacts/$artifact_id" "actions/artifacts/$artifact_id"
            done < <(jq -r '.[].id' <<<"$artifacts")
            caches="$(pages actions/caches actions_caches)"
            while IFS= read -r cache_id; do
              remove_cache "$cache_id"
            done < <(jq -r --arg prefix "$prefix" --argjson id "$id" '
              .[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix))) |
              select((.key | capture("-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$") | .run | tonumber) == $id) | .id' <<<"$caches")
            remove "actions/runs/$id" "actions/runs/$id"
            absent "actions/runs/$id/logs"
            pages releases '' | jq -e --argjson id "$id" --argjson protected "$protected" \
              'all(.[]; (.body | fromjson? | .run_id) != $id or (.tag_name as $tag | $protected | index($tag) != null))' >/dev/null
            printf '已删除并回查本平台旧Run及附属数据：%s\n' "$id"
          done < <(jq -c '.[]' <<<"$obsolete")

          remaining="$(read_runs)"
          jq -e --argjson keep "$keep" \
            'all(.[]; .status != "completed" or (.id as $id | $keep | index($id) != null))' <<<"$remaining" >/dev/null
          pages actions/artifacts artifacts | jq -e --argjson stale "$(jq -c '[.[].id]' <<<"$obsolete")" \
            'all(.[]; .workflow_run.id as $id | $stale | index($id) == null)' >/dev/null
          caches="$(pages actions/caches actions_caches)"
          jq -e --arg prefix "$prefix" --argjson keep "$keep" '
            all(.[] | select(.ref == "refs/heads/main" and (.key | startswith($prefix)));
              (.key | capture("-(?<run>[1-9][0-9]*)-(?<attempt>[1-9][0-9]*)$") | .run | tonumber) as $id |
              ($keep | index($id)) != null)' <<<"$caches" >/dev/null
          # 无法认领的本平台旧正式对象必须报错，不能漏掉后声称清理成功。
          pages releases '' | jq -e --arg prefix "公民·${label}·v" --argjson protected "$protected" '
            if all(.[] | select(.tag_name | startswith($prefix));
              .tag_name as $tag | $protected | index($tag) != null)
            then true else error("本平台仍有未清理或归属未确认的Release") end' >/dev/null
          encoded="$(jq -nr --arg prefix "公民·${label}·v" '$prefix | @uri')"
          pages "git/matching-refs/tags/$encoded" '' | jq -e --argjson protected "$protected" '
            if all(.[]; (.ref | ltrimstr("refs/tags/")) as $tag | $protected | index($tag) != null)
            then true else error("本平台仍有归属未确认的Tag") end' >/dev/null
          printf '本平台历史清理完成，保留Run：%s；本Run最终结果仍由GitHub确认。\n' "$keep"
