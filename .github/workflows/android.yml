name: citizenapp.android
on:
  workflow_dispatch:
concurrency:
  group: "${{ github.repository }}-android"
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
          components: rust-src, clippy
      - name: 准备本平台工具
        shell: bash
        run: |
          set -euo pipefail
          brew install bash
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flutter.zip" https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.47.2-stable.zip
          echo 'f456fd6733053d9301828a2e702d6cbec872923126809aa8c48eb0a696d6cc01  '"$RUNNER_TEMP/flutter.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/flutter.zip" "$RUNNER_TEMP"
          {
            echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter"
            echo "JAVA_HOME=$JAVA_HOME_17_arm64"
            echo "ANDROID_HOME=$HOME/Library/Android/sdk"
            echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk"
            echo "ANDROID_JAVA_HOME=$JAVA_HOME_17_arm64"
            echo "ANDROID_SDK_HOME=$HOME/Library/Android/sdk"
            echo "PRODUCT_BASH_BIN=$(brew --prefix bash)/bin/bash"
            echo "PRODUCT_GIT_BIN=$(command -v git)"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$JAVA_HOME_17_arm64/bin" >> "$GITHUB_PATH"
          if [ "android" = android ]; then
            curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
            echo 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806  '"$RUNNER_TEMP/gradle.zip" | shasum -a 256 --check
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            echo "CITIZENAPP_GRADLE=$RUNNER_TEMP/gradle-9.1.0/bin/gradle" >> "$GITHUB_ENV"
            "$HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platforms;android-36' 'ndk;28.2.13676358'
            echo "ANDROID_NDK_HOME=$HOME/Library/Android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          fi
      - name: 本 Runner 编译、签名并验收
        env:
          APP_KEY: "${{ secrets.APP_KEY }}"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_KEY"
          node scripts/build.mjs ci-build android > "$RUNNER_TEMP/citizenapp-android-result.json"
      - name: 创建并回读本平台正式 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          plan="$GITHUB_WORKSPACE/target/build/android/release-plan.json"
          tag="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.tag)' "$plan")"
          notes="$(node -e 'const p=require(process.argv[1]);process.stdout.write(p.notes)' "$plan")"
          assets="$GITHUB_WORKSPACE/target/build/android/release-assets"
          gh release create "$tag" "$assets"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "citizenapp · android · $tag" --notes-file "$notes" --draft --latest=false
          node scripts/build.mjs ci-verify-release android draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          node scripts/build.mjs ci-verify-release android published
      - name: 清理本平台编译现场
        if: always()
        shell: bash
        run: |
          if [ -d "target/build/android" ]; then node scripts/build.mjs finish android; fi
