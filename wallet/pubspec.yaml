name: citizen_wallet
description: 公民App钱包包：core、onboarding、account、history。
publish_to: none
version: 1.0.0
resolution: workspace
environment:
  sdk: ">=3.8.0 <4.0.0"

# 本包公开接口的真实依赖；上游约束沿用产品原锁。
dependencies:
  citizen_user: any
  citizen_assets: any
  citizen_citizen: any
  citizen_scanner: any
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: main
  citizen_storage: any
  citizen_system: any
  citizen_onchain: any
  citizen_offchain: any
  citizen_topup: any
  citizen_widgets: any
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1

  # history迁入后的直接运行依赖；沿用原包约束。
  isar_community: ^3.3.2

  chat: any
dev_dependencies:
  citizen_testing: any
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5
