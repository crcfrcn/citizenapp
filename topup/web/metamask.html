<!doctype html>
<html lang="zh-CN" data-topup-document="{{TOPUP_NONCE}}">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{TOPUP_NONCE}}'; connect-src https: wss:; img-src https: data:; base-uri 'none'; form-action 'none'" />
<title>充值付款</title>
</head>
<body>
<!-- SDK仅承载付款通信，不创建额外的钱包选择或连接页面。 -->
<script nonce="{{TOPUP_NONCE}}" src="data:application/javascript;base64,{{TOPUP_SCRIPT}}"></script>
<script nonce="{{TOPUP_NONCE}}">
window.TopupBridge.postMessage(JSON.stringify({kind:'document_ready',nonce:document.documentElement.getAttribute('data-topup-document'),ready:typeof window.CitizenTopup?.start==='function'}));
</script>
</body>
</html>
