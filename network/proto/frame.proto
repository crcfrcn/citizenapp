// 顶层帧、密文消息及附件控制协议定义。

syntax = "proto3";

package chat.protocol;

// 定义WSS顶层聊天帧、客户端命令、服务端回执和资源计量。
// WSS 唯一顶层二进制帧。业务相关性只使用消息、附件或密钥包自身编号。
message ChatFrame {
  // 仅服务端响应填写；客户端不能用它声明资格或修改用量。
  ResourceUsage resource_usage = 50;
  oneof body {
    Ready ready = 1;
    Failure failure = 2;
    Success success = 3;
    Ping ping = 4;
    Pong pong = 5;
    PublishKeyPackage publish_key_package = 10;
    ResolveKeyPackages resolve_key_packages = 11;
    KeyPackageBatch key_package_batch = 12;
    SendMessage send_message = 20;
    SyncMessages sync_messages = 21;
    MessageBatch message_batch = 22;
    AcknowledgeMessages acknowledge_messages = 23;
    MessageAvailable message_available = 24;
    ResolveGroup resolve_group = 25;
    GroupBinding group_binding = 26;
    SubmitCommit submit_commit = 27;
    BeginAttachment begin_attachment = 30;
    CompleteAttachment complete_attachment = 31;
    AttachmentReady attachment_ready = 32;
    AcknowledgeAttachment acknowledge_attachment = 33;
    AbortAttachment abort_attachment = 34;
    RegisterPush register_push = 40;
    RemovePush remove_push = 41;
  }
}

// 中性App计量回执；不包含会员、价格或数据库模型。
message ResourceUsage {
  string user_id = 1;
  string device_id = 2;
  string account_id = 3;
  uint64 binding_revision = 4;
  uint64 server_time_millis = 5;
  repeated ResourceCounter counters = 6;
}

message ResourceCounter {
  string metric = 1;
  uint64 window_start_millis = 2;
  uint64 charged = 3;
  uint64 used = 4;
  optional uint64 limit = 5;
}

message Ready {
  uint64 server_time_millis = 1;
}

message Failure {
  string code = 1;
  string message = 2;
}

message Success {
  string kind = 1;
  repeated string ids = 2;
}

message Ping {
  uint64 sent_at_millis = 1;
}

message Pong {
  uint64 sent_at_millis = 1;
  uint64 server_time_millis = 2;
}

message KeyPackage {
  string user_id = 1;
  string device_id = 2;
  string key_package_ref = 3;
  bytes key_package = 4;
  string cipher_suite = 5;
  uint64 not_before = 6;
  uint64 not_after = 7;
  bool last_resort = 8;
}

message PublishKeyPackage {
  KeyPackage key_package = 1;
}

message ResolveKeyPackages {
  string user_id = 1;
  string device_id = 2;
  uint32 limit = 3;
}

message KeyPackageBatch {
  repeated KeyPackage key_packages = 1;
}

message SendMessage {
  EncryptedMessage message = 1;
}

message SyncMessages {
  uint32 limit = 1;
  // 当前设备邮箱中最后实际扫描的位置；客户端只透传服务端返回值。
  string cursor = 2;
}

message MessageBatch {
  repeated EncryptedMessage messages = 1;
  // 空值表示本轮到末尾；空消息页仍可能存在下一扫描位置。
  string next_cursor = 2;
}

message AcknowledgeMessages {
  repeated string message_ids = 1;
}

message MessageAvailable {
  reserved 1, 2, 3;
  reserved "message_id", "conversation_id", "server_time_millis";

  EncryptedMessage message = 4;
  uint64 expires_at_millis = 5;
}

// 查询业务会话唯一已接受的 MLS 组。空 group_id 表示尚未建组。
message ResolveGroup {
  string conversation_id = 1;
}

message GroupBinding {
  string conversation_id = 1;
  bytes group_id = 2;
}

// 服务端仅决定投递次序。客户端用 OpenMLS 校验及合并 Commit、Welcome。
// 重试须提交原 operation_id 与完全相同的内容，禁止换密文占用同一 epoch。
message SubmitCommit {
  string conversation_id = 1;
  bytes group_id = 2;
  uint64 epoch = 3;
  string operation_id = 4;
  bytes commit = 5;
  repeated EncryptedMessage messages = 6;
}

message BeginAttachment {
  AttachmentMetadata attachment = 1;
}

message CompleteAttachment {
  string attachment_id = 1;
}

message AttachmentReady {
  string attachment_id = 1;
}

message AcknowledgeAttachment {
  string attachment_id = 1;
  // 只定位上传者的 CID，收件权限仍由服务端从附件验证。
  string owner_cid = 2;
}

message AbortAttachment {
  string attachment_id = 1;
}

message RegisterPush {
  string platform = 1;
  string token = 2;
}

message RemovePush {
  string platform = 1;
}

// 定义每设备聊天路由、独立密文及逻辑消息字段。
// 一个接收设备的中性路由身份。
message Recipient {
  string user_id = 1;
  string device_id = 2;
}

// OpenMLS 为一个接收设备产生的独立密文。
message EncryptedDelivery {
  Recipient recipient = 1;
  bytes openmls_ciphertext = 2;
}

// 一条逻辑消息。message_id 是消息全链路唯一编号。
message EncryptedMessage {
  string message_id = 1;
  string conversation_id = 2;
  string sender_user_id = 3;
  string sender_device_id = 4;
  repeated EncryptedDelivery deliveries = 5;
  uint64 created_at_millis = 6;
  bytes group_id = 7;
}

// chat 内部使用的设备路由快照。
message ChatRoute {
  string peer_user_id = 1;
  string device_id = 2;
  uint64 created_at_millis = 3;
  uint64 expires_at_millis = 4;
}

// 定义端到端密文附件的分块摘要及控制面消息协议。
// 一块端到端加密附件的密文字节摘要。
message AttachmentChunk {
  uint32 chunk_index = 1;
  uint64 cipher_byte_size = 2;
  string cipher_sha256 = 3;
}

// 附件控制面元数据。服务端永远拿不到内容密钥和明文字节。
message AttachmentMetadata {
  string attachment_id = 1;
  string sender_user_id = 2;
  repeated string recipient_user_ids = 3;
  repeated AttachmentChunk chunks = 4;
  uint64 cipher_byte_size = 5;
  string cipher_sha256 = 6;
  uint64 created_at_millis = 7;
}
