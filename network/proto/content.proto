// 基础内容和媒体内容的原协议定义。

syntax = "proto3";

package chat.protocol;

// 定义基础聊天文本等内容的唯一Protobuf字段协议。
// 第一类聊天内容的唯一 wire 真源。协议依靠 protobuf 字段号演进，不增加
// 自定义版本字段；未知字段和未知内容类型由 公民聊天 失败关闭。
message BasicPayload {
  oneof content {
    TextContent text = 1;
    EmojiContent emoji = 2;
    StickerContent sticker = 3;
  }
}

message TextContent {
  string value = 1;
}

message EmojiContent {
  string value = 1;
}

message StickerContent {
  string pack_id = 1;
  string sticker_id = 2;
}

// 定义MLS消息内媒体附件的公开描述和互斥内容字段。
// 普通MLS聊天消息内的附件公开协议描述，不携带应用密钥。
message MediaDescriptor {
  string attachment_id = 1;
  string file_name = 2;
  string mime = 3;
  uint64 byte_size = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 duration_ms = 7;
  string blurhash = 8;
  reserved 9;
  uint64 cipher_byte_size = 10;
  bytes cipher_sha256 = 11;
  string attachment_group_id = 12;
  bytes attachment_welcome = 13;
  repeated string attachment_member_identities = 14;
  string sender_identity = 15;
  uint32 attachment_chunk_count = 16;
  bytes plain_sha256 = 17;
  uint64 attachment_chat_epoch = 18;
}

// 媒体oneof使用16至19，与基本载荷1至3互斥；未知字段与非规范编码必须拒绝。
message MediaPayload {
  oneof content {
    MediaDescriptor image = 16;
    MediaDescriptor video = 17;
    MediaDescriptor file = 18;
    MediaDescriptor audio = 19;
  }
}
